# =============================================================================
# Certificate Manager Helm Chart — Base Values
#
# Override per environment using:
#   values-<env>-<cluster>.yaml
#
# Secrets are currently stored in the env values files for simplicity.
# To migrate to Azure Key Vault CSI driver, populate existingSecret.name
# with a pre-created K8s Secret and remove the secrets block from values files.
# =============================================================================

# --------------------------------------------------
# Release identity
# --------------------------------------------------
fullnameOverride: "dpn-certificate-manager"
namespace: "ns-dpn-01"

# --------------------------------------------------
# Image
# tag is passed in by the CD pipeline: --set image.tag=<buildId>
# --------------------------------------------------
image:
  repository: ""          # e.g. <<CONTAINER_REGISTRY_URL>>/dpn-federator-certificate-manager
  tag: "latest"
  pullPolicy: Always

# --------------------------------------------------
# Replicas — keep 1; CLM writes to a shared file share
# --------------------------------------------------
replicaCount: 1

# --------------------------------------------------
# Pod security — non-root, locked-down seccomp
# --------------------------------------------------
podSecurityContext:
  runAsNonRoot: true
  runAsUser: 10001
  runAsGroup: 10001
  fsGroup: 10001

containerSecurityContext:
  allowPrivilegeEscalation: false
  runAsNonRoot: true
  runAsUser: 10001
  runAsGroup: 10001
  seccompProfile:
    type: RuntimeDefault
  capabilities:
    drop:
      - ALL

# --------------------------------------------------
# JVM options
# --------------------------------------------------
javaOpts: >-
  -Djava.security.egd=file:/dev/./urandom
  -XX:MaxRAMPercentage=75.0
  -Djava.io.tmpdir=/app/tmp
  -Djava.net.preferIPv4Stack=true
  -Dnetworkaddress.cache.negative.ttl=0

# --------------------------------------------------
# Resources
# --------------------------------------------------
resources:
  requests:
    cpu: 250m
    memory: 512Mi
  limits:
    cpu: 500m
    memory: 1Gi

# --------------------------------------------------
# Probes
# --------------------------------------------------
livenessProbe:
  initialDelaySeconds: 60
  periodSeconds: 30
  failureThreshold: 3

readinessProbe:
  initialDelaySeconds: 30
  periodSeconds: 15
  failureThreshold: 3

# --------------------------------------------------
# Vault connectivity
# --------------------------------------------------
vault:
  uri: "http://dpn-vault.ns-dpn-01.svc.cluster.local:8200"
  authentication: "APPROLE"        # TOKEN | KUBERNETES | APPROLE
  authRole: "certificate-manager"
  pkiMount: "pki-client"
  secretPath: "node-net/client"
  # AppRole login (role_id here is non-sensitive; secret_id is supplied via the Secret).
  appRole:
    role: "certificate-manager"
    roleId: ""                   # override per env values file
    mountPath: "approle"

# --------------------------------------------------
# Certificate identity
# --------------------------------------------------
certIdent:
  keystoreAlias: "federator"

# --------------------------------------------------
# OAuth2 — Management Node token endpoint
# --------------------------------------------------
oauth2:
  tokenUri: ""
  clientId: ""
  authMode: "client_credentials"
  jwtAlgorithm: "RS256"

# --------------------------------------------------
# Management Node
# --------------------------------------------------
managementNode:
  baseUrl: ""

# --------------------------------------------------
# Certificate scheduling & subject
# --------------------------------------------------
cert:
  renewalRateMs: "3600000"      # 1 hour
  syncRateMs: "60000"           # 1 minute
  renewalThresholdDays: "100"
  keySize: "2048"
  subject:
    country: "UK"
    state: ""
    locality: ""
    org: ""
    ou: ""
    cn: ""
    altNames: ""
  bootstrapOid: "1.3.6.1.4.1.32473.1.1"
  intermediateMinValidDays: "14"

# --------------------------------------------------
# Logging
# --------------------------------------------------
logging:
  levelSpringSecurity: "INFO"
  levelApp: "INFO"
  levelResilience4j: "INFO"

# --------------------------------------------------
# OTEL
# --------------------------------------------------
otel:
  env:
    OTEL_SERVICE_NAME: "dpn-certificate-manager"
    OTEL_TRACES_ENABLED: "true"
    OTEL_TRACES_SAMPLER_ARG: "1.0"
    OTEL_EXPORTER_OTLP_ENDPOINT: ""
    OTEL_HEARTBEAT_INTERVAL_SECONDS: "900"
    OTEL_TRUSTSTORE_LOCATION: "/app/truststore/truststore.jks"


# --------------------------------------------------
# Secrets — stored in env values files for now.
# Migrate to AKV CSI driver later by setting existingSecret.name.
# (mTLS keystore/truststore passwords removed — the mTLS stores are built in
#  memory with an ephemeral password; no file share, no CERT_DEST output.)
# --------------------------------------------------
secrets:
  vaultToken: ""               # used only when vault.authentication=TOKEN
  vaultAppRoleSecretId: ""     # used only when vault.authentication=APPROLE (sensitive)

# If set, the chart will use this existing secret instead of creating one.
existingSecret:
  name: ""

# --------------------------------------------------
# Service — CLM exposes no HTTP port; omit or keep ClusterIP
# for future actuator/metrics exposure.
# --------------------------------------------------
service:
  enabled: false
  type: ClusterIP
  port: 8080
  
# --------------------------------------------------
# Vault HTTPS Truststore
# Name of a pre-existing K8s secret containing truststore.jks
# Created once manually: kubectl create secret generic <name>
#   --from-file=truststore.jks=<path> -n <namespace>
# Leave empty to use bundled classpath:truststore.jks
# --------------------------------------------------
vaultTruststore:
  secretName: ""             # e.g. cert-manager-truststore
  mountPath: "/app/truststore"

# --------------------------------------------------
# Azure Key Vault — Secret Provider Class
# Set enabled: true to use AKV CSI driver instead
# of the chart-managed Secret resource
# --------------------------------------------------
keyvault:
  enabled: false          # set true in env values file
  clientID: ""
  name: ""
  tenantId: ""
