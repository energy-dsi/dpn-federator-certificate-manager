{{- $name := include "certificate-manager.name" . }}
# =============================================================================
# Certificate Manager — ConfigMap
# Non-sensitive runtime configuration only.
# Secrets (passwords, tokens) live in the Secret resource.
# =============================================================================
apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ $name }}-config
  namespace: {{ .Values.namespace }}
  labels:
    {{- include "certificate-manager.labels" . | nindent 4 }}
data:
  SPRING_APPLICATION_NAME: "certificate-manager"

  # ---- Vault ----------------------------------------------------------------
  VAULT_URI:              {{ .Values.vault.uri | quote }}
  {{- if .Values.vaultTruststore.secretName }}
  VAULT_SSL_TRUST_STORE: "file:{{ .Values.vaultTruststore.mountPath }}/truststore.jks"
  {{- end }}
  VAULT_AUTHENTICATION:   {{ .Values.vault.authentication | quote }}
  VAULT_AUTH_ROLE:        {{ .Values.vault.authRole | quote }}
  VAULT_PKI_MOUNT:        {{ .Values.vault.pkiMount | quote }}
  VAULT_SECRET_PATH:      {{ .Values.vault.secretPath | quote }}
  # AppRole (role_id is not sensitive; secret_id is provided via the Secret resource)
  VAULT_APPROLE_ROLE:       {{ .Values.vault.appRole.role | quote }}
  VAULT_APPROLE_ROLE_ID:    {{ .Values.vault.appRole.roleId | quote }}
  VAULT_APPROLE_MOUNT_PATH: {{ .Values.vault.appRole.mountPath | quote }}

  # ---- Certificate identity ----------------------------------------------
  CERT_KEYSTORE_ALIAS:           {{ .Values.certIdent.keystoreAlias | quote }}

  # ---- OAuth2 ---------------------------------------------------------------
  OAUTH2_TOKEN_URI:     {{ .Values.oauth2.tokenUri | quote }}
  OAUTH2_CLIENT_ID:     {{ .Values.oauth2.clientId | quote }}
  OAUTH2_AUTH_MODE:     {{ .Values.oauth2.authMode | quote }}
  OAUTH2_JWT_ALGORITHM: {{ .Values.oauth2.jwtAlgorithm | quote }}

  # ---- Management Node ------------------------------------------------------
  MANAGEMENT_NODE_BASE_URL: {{ .Values.managementNode.baseUrl | quote }}

  # ---- Scheduling -----------------------------------------------------------
  CERT_RENEWAL_RATE: {{ .Values.cert.renewalRateMs | quote }}
  CERT_SYNC_RATE:    {{ .Values.cert.syncRateMs | quote }}

  # ---- Certificate subject --------------------------------------------------
  CERT_RENEWAL_THRESHOLD:         {{ .Values.cert.renewalThresholdDays | quote }}
  CERT_KEY_SIZE:                  {{ .Values.cert.keySize | quote }}
  CERT_SUBJECT_COUNTRY:           {{ .Values.cert.subject.country | quote }}
  CERT_SUBJECT_STATE:             {{ .Values.cert.subject.state | quote }}
  CERT_SUBJECT_LOCALITY:          {{ .Values.cert.subject.locality | quote }}
  CERT_SUBJECT_ORG:               {{ .Values.cert.subject.org | quote }}
  CERT_SUBJECT_OU:                {{ .Values.cert.subject.ou | quote }}
  CERT_SUBJECT_CN:                {{ .Values.cert.subject.cn | quote }}
  CERT_SUBJECT_ALT_NAMES:         {{ .Values.cert.subject.altNames | quote }}
  BOOTSTRAP_OID:                  {{ .Values.cert.bootstrapOid | quote }}
  CERT_INTERMEDIATE_MIN_VALID_DAYS: {{ .Values.cert.intermediateMinValidDays | quote }}

  # ---- Logging --------------------------------------------------------------
  LOG_LEVEL_SPRING_SECURITY: {{ .Values.logging.levelSpringSecurity | quote }}
  LOG_LEVEL_APP:             {{ .Values.logging.levelApp | quote }}
  LOG_LEVEL_RESILIENCE4J:    {{ .Values.logging.levelResilience4j | quote }}

  # ---- OTEL --------------------------------------------------------------
  OTEL_SERVICE_NAME:           {{ .Values.otel.env.OTEL_SERVICE_NAME | quote }}
  OTEL_TRACES_ENABLED:         {{ .Values.otel.env.OTEL_TRACES_ENABLED | quote }}
  OTEL_TRACES_SAMPLER_ARG:     {{ .Values.otel.env.OTEL_TRACES_SAMPLER_ARG | quote }}
  OTEL_EXPORTER_OTLP_ENDPOINT: {{ .Values.otel.env.OTEL_EXPORTER_OTLP_ENDPOINT | quote }}
  OTEL_HEARTBEAT_INTERVAL_SECONDS: {{ .Values.otel.env.OTEL_HEARTBEAT_INTERVAL_SECONDS | quote }}
  OTEL_TRUSTSTORE_LOCATION:    {{ .Values.otel.env.OTEL_TRUSTSTORE_LOCATION | quote }}