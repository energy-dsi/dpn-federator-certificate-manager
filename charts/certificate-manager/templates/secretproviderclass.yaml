{{- if .Values.keyvault.enabled }}
{{- $auth := .Values.vault.authentication | default "TOKEN" | upper }}
# =============================================================================
# Certificate Manager — Azure Key Vault SecretProviderClass
#
# Pulls ONLY the secrets the app actually consumes, and only the ones that are
# genuinely cert-manager-specific:
#   - Vault auth credential: VAULT-APPROLE-SECRET-ID (approle) or VAULT-TOKEN (token)
#
# NOT pulled here (anymore):
#   - OAUTH2-CLIENT-SECRET  ("management-node OAuth2" via OAuth2TokenServiceImpl) is
#     dead in every real environment: that bean only activates when
#     application.oauth2.auth-mode=client_credentials, but every deployed values file
#     sets authMode=private_key_jwt, which activates PrivateJwtTokenServiceImpl
#     instead (Vault-cert-based, no client secret). Only the never-deployed base
#     values.yaml still defaulted to client_credentials.
#   - TRUSTSTORE-PASSWORD (universal DPN platform truststore password, used to trust
#     Vault HTTPS) now comes from tls-auth-secret instead of an independent Key Vault
#     re-sync here - see deployment.yaml's VAULT_SSL_TRUST_STORE_PASSWORD /
#     OTEL_TRUSTSTORE_PASSWORD env entries. tls-auth-secret is created once by
#     dpn-tls-cd.yaml (this repo) from the same KEY VAULT object, so the value is
#     unchanged - only where it's read from changed.
#
# NOT pulled anymore (removed with the SMB file share / in-memory keystore change):
#   - MTLS-KEYSTORE-PASSWORD / MTLS-TRUSTSTORE-PASSWORD  (the mTLS keystore password is
#     now an ephemeral, process-local value generated in MtlsHttpClientBuilder)
#   - AZURE-STORAGE-ACCOUNT-NAME / -KEY + the azure-fileshare-secret (no file share)
# =============================================================================
apiVersion: secrets-store.csi.x-k8s.io/v1
kind: SecretProviderClass
metadata:
  name: dpn-certificate-manager-kv-secrets
  namespace: {{ .Values.namespace }}
spec:
  provider: azure
  parameters:
    usePodIdentity: "false"
    useVMManagedIdentity: "true"
    userAssignedIdentityID: "{{ .Values.keyvault.clientID }}"
    keyvaultName: "{{ .Values.keyvault.name }}"
    tenantId: "{{ .Values.keyvault.tenantId }}"
    objects: |
      array:
        {{- if eq $auth "APPROLE" }}
        - |
          objectName: VAULT-APPROLE-SECRET-ID
          objectType: secret
        {{- else }}
        - |
          objectName: VAULT-TOKEN
          objectType: secret
        {{- end }}
  secretObjects:
    # Certificate Manager app secrets - vault auth credential only now; the
    # truststore password moved to tls-auth-secret (see deployment.yaml), and
    # OAUTH2-CLIENT-SECRET was removed as confirmed dead (see comment above).
    - secretName: certificate-manager-secrets
      type: Opaque
      data:
        {{- if eq $auth "APPROLE" }}
        - objectName: VAULT-APPROLE-SECRET-ID
          key: VAULT_APPROLE_SECRET_ID
        {{- else }}
        - objectName: VAULT-TOKEN
          key: VAULT_TOKEN
        {{- end }}
{{- end }}
