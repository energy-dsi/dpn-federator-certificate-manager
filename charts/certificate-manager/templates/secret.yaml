{{- $name := include "certificate-manager.name" . }}
{{- if not .Values.existingSecret.name }}
# =============================================================================
# Certificate Manager — Secret
#
# Values are sourced from the environment values file (values-<env>-<cluster>.yaml).
# When ready, migrate to Azure Key Vault CSI driver and point existingSecret.name
# at the pre-created K8s Secret — this template will then be skipped entirely.
# =============================================================================
apiVersion: v1
kind: Secret
metadata:
  name: {{ $name }}-secrets
  namespace: {{ .Values.namespace }}
  labels:
    {{- include "certificate-manager.labels" . | nindent 4 }}
  annotations:
    # Prevent Helm diff tools from printing secret values in CI logs
    helm.sh/resource-policy: keep
type: Opaque
stringData:
  # Vault auth: VAULT_TOKEN is used when authentication=TOKEN; VAULT_APPROLE_SECRET_ID
  # (sensitive) is used when authentication=APPROLE.
  VAULT_TOKEN:                  {{ .Values.secrets.vaultToken | quote }}
  VAULT_APPROLE_SECRET_ID:      {{ .Values.secrets.vaultAppRoleSecretId | quote }}
{{- end }}
