{{- $name := include "certificate-manager.name" . }}
{{- if not .Values.existingSecret.name }}
# =============================================================================
# Certificate Manager — Secret
#
# Values are sourced from the environment values file (values-<env>-<cluster>.yaml).
# When ready, migrate to Azure Key Vault CSI driver and point existingSecret.name
# at the pre-created K8s Secret — this template will then be skipped entirely.
# =============================================================================
apiVersion: v1
kind: Secret
metadata:
  name: {{ $name }}-secrets
  namespace: {{ .Values.namespace }}
  labels:
    {{- include "certificate-manager.labels" . | nindent 4 }}
  annotations:
    # Prevent Helm diff tools from printing secret values in CI logs
    helm.sh/resource-policy: keep
type: Opaque
stringData:
  MTLS_KEYSTORE_PASSWORD:       {{ .Values.secrets.mtlsKeystorePassword | quote }}
  MTLS_TRUSTSTORE_PASSWORD:     {{ .Values.secrets.mtlsTruststorePassword | quote }}
  CERT_DEST_KEYSTORE_PASSWORD:  {{ .Values.secrets.certDestKeystorePassword | quote }}
  CERT_DEST_TRUSTSTORE_PASSWORD: {{ .Values.secrets.certDestTruststorePassword | quote }}
  OAUTH2_CLIENT_SECRET:         {{ .Values.secrets.oauth2ClientSecret | quote }}
  VAULT_TOKEN:                  {{ .Values.secrets.vaultToken | quote }}
{{- end }}
