# --------------------------
# trigger: none
# --------------------------
on:
  workflow_dispatch:
    inputs:

      ServiceConnection:
        description: "Service Connection"
        required: true
        default: sc-dpn-dev-001
        type: choice
        options:
          - sc-dpn-dev-001
          - sc-dpn-dev-002
          - sc-dpn-test-001
          - sc-dpn-test-002

      environment:
        description: "Environment Name"
        required: true
        default: dev
        type: choice
        options:
          - dev
          - devtest
          - test

      cluster:
        description: "Cluster"
        required: true
        default: dpn01
        type: choice
        options:
          - dpn01
          - dpn02

      enablePIT:
        description: "Enable PIT Mutation Tests"
        required: false
        default: "false"
        type: boolean

jobs:

# =====================================================
# Stage 1 — Unit Tests
# =====================================================
  unit_tests:
    runs-on: ubuntu-latest

    env:
      CERT_MANAGER_IMAGE: dpn-federator-certificate-manager
      IMAGE_TAG: ${{ github.run_id }}
      DOCKERFILE_PATH: docker/Dockerfile
      PARAMETERS_FILE: .pipelines/github-actions-pipelines/gcp-pipelines/config/${{ github.event.inputs.environment }}-${{ github.event.inputs.cluster }}.json
      CLOC_EXCLUDES: target,.git,node_modules

    steps:
      - name: checkout
        uses: actions/checkout@v4

      # Load Environment Config
      - name: Load Environment Config
        run: |
          echo "Loading config: $PARAMETERS_FILE"
          for param in $(jq -r 'keys_unsorted | .[]' "$PARAMETERS_FILE"); do
            value=$(jq -r ".\"$param\"" "$PARAMETERS_FILE")
            echo "$param=$value" >> $GITHUB_ENV
          done

      # Java Tool Installer
      - name: Set Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      # Maven settings
      - name: Configure Maven Settings
        run: |
          mkdir -p ~/.m2
          cat <<EOF > ~/.m2/settings.xml
          <settings>
            <servers>
              <server>
                <id>github</id>
                <username>${{ secrets.GITHUB_MAVEN_USERNAME }}</username>
                <password>${{ secrets.GITHUB_MAVEN_TOKEN }}</password>
              </server>
            </servers>
          </settings>
          EOF

      # DockerHub login
      - name: DockerHub Login
        run: |
          echo "${{ secrets.DOCKERHUB_PASSWORD }}" | docker login -u "${{ secrets.DOCKERHUB_USERNAME }}" --password-stdin

      # Maven Build
      - name: Run mvn clean verify
        run: mvn clean verify

      # PIT mutation test
      - name: Run PIT Tests
        if: ${{ github.event.inputs.enablePIT == 'true' }}
        run: |
          export MAVEN_OPTS="--add-opens=java.base/java.lang=ALL-UNNAMED \
          --add-opens=java.base/java.util=ALL-UNNAMED \
          --add-opens=java.base/java.io=ALL-UNNAMED \
          --add-opens=java.base/java.nio=ALL-UNNAMED \
          --add-opens=java.base/java.lang.reflect=ALL-UNNAMED -Xmx2048m"
          mvn org.pitest:pitest-maven:mutationCoverage
      
      - name: Upload JUnit Reports
        uses: actions/upload-artifact@v4
        with:
          name: junit-reports
          path: target/surefire-reports/

      - name: Upload PIT
        if: ${{ github.event.inputs.enablePIT == 'true' }}
        uses: actions/upload-artifact@v4
        with:
          name: pit-report
          path: target/pit-reports

# =====================================================
# Stage 3 — Build + Push
# =====================================================
  build:
    runs-on: ubuntu-latest
    needs: unit_tests

    permissions:
      id-token: write
      contents: read

    env:
      CERT_MANAGER_IMAGE: dpn-federator-certificate-manager
      IMAGE_TAG: ${{ github.run_id }}
      DOCKERFILE_PATH: docker/Dockerfile
      PARAMETERS_FILE: .pipelines/github-actions-pipelines/gcp-pipelines/config/${{ github.event.inputs.environment }}-${{ github.event.inputs.cluster }}.json

    steps:
      - uses: actions/checkout@v4

      # Load config
      - name: Load Environment Config
        run: |
          for param in $(jq -r 'keys_unsorted | .[]' "$PARAMETERS_FILE"); do
            value=$(jq -r ".\"$param\"" "$PARAMETERS_FILE")
            echo "$param=$value" >> $GITHUB_ENV
          done

      # Java
      - name: Set Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      # Extract version
      - name: Extract Project Version
        run: |
          PROJECT_VERSION=$(mvn help:evaluate -Dexpression=project.version -q -DforceStdout)
          echo "PROJECT_VERSION=$PROJECT_VERSION" >> $GITHUB_ENV

# -------------------------
# GCP LOGIN
# -------------------------
      - name: Authenticate to GCP
        uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: ${{ secrets.GCP_WIF_PROVIDER }}
          service_account: ${{ secrets.GCP_SERVICE_ACCOUNT }}

      - name: Configure Docker
        run: gcloud auth configure-docker

# -------------------------
# Docker Build
# -------------------------
      - name: Build Image
        run: |
          docker build \
            --build-arg BASE_REGISTRY=$BASE_REGISTRY \
            --build-arg JAR_NAME=federator-certificate-manager-$PROJECT_VERSION \
            -f $DOCKERFILE_PATH \
            -t ${{ secrets.GCP_ARTIFACT_REGISTRY }}/$CERT_MANAGER_IMAGE:$IMAGE_TAG .

# -------------------------
# Docker Push
# -------------------------
      - name: Push Image
        run: |
          docker push ${{ secrets.GCP_ARTIFACT_REGISTRY }}/$CERT_MANAGER_IMAGE:$IMAGE_TAG

# -------------------------
# Cleanup
# -------------------------
      - name: Cleanup Docker Image
        if: always()
        run: |
          docker rmi ${{ secrets.GCP_ARTIFACT_REGISTRY }}/$CERT_MANAGER_IMAGE:$IMAGE_TAG || true