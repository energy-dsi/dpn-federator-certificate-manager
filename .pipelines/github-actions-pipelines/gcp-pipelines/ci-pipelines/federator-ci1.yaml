# --------------------------
# trigger: none
# --------------------------
on:
  workflow_dispatch:
    inputs:

      ServiceConnection:
        description: "Service Connection"
        required: true
        default: sc-dpn-dev-001
        type: choice
        options:
          - sc-dpn-dev-001
          - sc-dpn-dev-002
          - sc-dpn-test-001
          - sc-dpn-test-002

      environment:
        description: "Environment Name"
        required: true
        default: dev
        type: choice
        options:
          - dev
          - devtest
          - test

      cluster:
        description: "Cluster"
        required: true
        default: dpn01
        type: choice
        options:
          - dpn01
          - dpn02

      enablePIT:
        description: "Enable PIT Mutation Tests"
        required: false
        default: "false"
        type: boolean

# --------------------------
# Env Variables
# --------------------------
env:
  CLIENT_IMAGE: dpn-federator-client
  SERVER_IMAGE: dpn-federator-server
  IMAGE_TAG: ${{ github.run_id }}

  PARAMETERS_FILE: .pipelines/github-actions-pipelines/gcp-pipelines/config/${{ github.event.inputs.environment }}-${{ github.event.inputs.cluster }}.json
  CLOC_EXCLUDES: target,.git,node_modules

# =====================================================
# Stage 1 — UnitTests
# =====================================================
  unit_tests:
    runs-on: ubuntu-latest

    steps:
      - name: checkout
        uses: actions/checkout@v4

      # Load environment config
      - name: Load Environment Config
        run: |
          echo "Loading config: $PARAMETERS_FILE"
          for param in $(jq -r 'keys_unsorted | .[]' "$PARAMETERS_FILE"); do
            value=$(jq -r ".\"$param\"" "$PARAMETERS_FILE")
            echo "$param=$value" >> $GITHUB_ENV
          done

      # JavaToolInstaller@0
      - name: Set Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      # Maven settings
      - name: Configure Maven settings
        run: |
          mkdir -p ~/.m2
          cat <<EOF > ~/.m2/settings.xml
          <settings>
            <servers>
              <server>
                <id>github</id>
                <username>${{ secrets.GITHUB_MAVEN_USERNAME }}</username>
                <password>${{ secrets.GITHUB_MAVEN_TOKEN }}</password>
              </server>
            </servers>
          </settings>
          EOF

      # DockerHub login
      - name: DockerHub login
        run: |
          echo "${{ secrets.DOCKERHUB_PASSWORD }}" | docker login -u "${{ secrets.DOCKERHUB_USERNAME }}" --password-stdin

      # Maven@4
      - name: Run mvn clean verify
        run: mvn clean verify

      # PIT
      - name: Run PIT Mutation Tests
        if: ${{ github.event.inputs.enablePIT == 'true' }}
        run: |
          export MAVEN_OPTS="--add-opens=java.base/java.lang=ALL-UNNAMED \
          --add-opens=java.base/java.util=ALL-UNNAMED \
          --add-opens=java.base/java.io=ALL-UNNAMED \
          --add-opens=java.base/java.nio=ALL-UNNAMED \
          --add-opens=java.base/java.lang.reflect=ALL-UNNAMED -Xmx2048m"
          mvn org.pitest:pitest-maven:mutationCoverage

      # PublishCodeCoverageResults@2
      - name: Publish JaCoCo Coverage
        run: |
          echo "Coverage file: target/site/jacoco/jacoco.xml"

      # PublishPipelineArtifact@1
      - name: Publish JUnit Reports Folder
        uses: actions/upload-artifact@v4
        with:
          name: JUnit-reports
          path: target/surefire-reports/

      # Publish PIT
      - name: Publish PIT Report
        if: ${{ github.event.inputs.enablePIT == 'true' }}
        uses: actions/upload-artifact@v4
        with:
          name: pit-report
          path: target/pit-reports

# =====================================================
# Stage 2 — Build
# =====================================================
  build:
    runs-on: ubuntu-latest
    needs: unit_tests

    permissions:
      id-token: write
      contents: read

    steps:
      - name: checkout
        uses: actions/checkout@v4

      # Load config
      - name: Load Environment Config
        run: |
          echo "Loading config: $PARAMETERS_FILE"
          for param in $(jq -r 'keys_unsorted | .[]' "$PARAMETERS_FILE"); do
            value=$(jq -r ".\"$param\"" "$PARAMETERS_FILE")
            echo "$param=$value" >> $GITHUB_ENV
          done

      # GCP Auth
      - name: Login GCP Artifact Registry
        uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: ${{ secrets.GCP_WIF_PROVIDER }}
          service_account: ${{ secrets.GCP_SERVICE_ACCOUNT }}

      - name: Configure Docker
        run: gcloud auth configure-docker

      # Build client
      - name: Build Client Image
        run: |
          docker build \
          --build-arg BASE_REGISTRY=$BASE_REGISTRY \
          --build-arg GITHUB_MAVEN_USERNAME=${{ secrets.GITHUB_MAVEN_USERNAME }} \
          --build-arg GITHUB_MAVEN_TOKEN=${{ secrets.GITHUB_MAVEN_TOKEN }} \
          -f Dockerfile.client \
          -t ${{ secrets.GCP_ARTIFACT_REGISTRY }}/$CLIENT_IMAGE:$IMAGE_TAG .

      # Build server
      - name: Build Server Image
        run: |
          docker build \
          --build-arg BASE_REGISTRY=$BASE_REGISTRY \
          --build-arg GITHUB_MAVEN_USERNAME=${{ secrets.GITHUB_MAVEN_USERNAME }} \
          --build-arg GITHUB_MAVEN_TOKEN=${{ secrets.GITHUB_MAVEN_TOKEN }} \
          -f Dockerfile.server \
          -t ${{ secrets.GCP_ARTIFACT_REGISTRY }}/$SERVER_IMAGE:$IMAGE_TAG .

      # Push
      - name: Tag and Push Images
        run: |
          docker push ${{ secrets.GCP_ARTIFACT_REGISTRY }}/$CLIENT_IMAGE:$IMAGE_TAG
          docker push ${{ secrets.GCP_ARTIFACT_REGISTRY }}/$SERVER_IMAGE:$IMAGE_TAG

      # Cleanup
      - name: Cleanup Docker & Temp Files
        if: always()
        run: |
          docker rmi ${{ secrets.GCP_ARTIFACT_REGISTRY }}/$CLIENT_IMAGE:$IMAGE_TAG || true
          docker rmi ${{ secrets.GCP_ARTIFACT_REGISTRY }}/$SERVER_IMAGE:$IMAGE_TAG || true