name: Certificate Manager CD Pipeline — DPN Platform

# =============================================================================
# trigger: none
# =============================================================================
on:
  workflow_dispatch:
    inputs:

      ServiceConnection:
        description: "GCP Service Account"
        required: true
        default: "gcp-sa-dpn-dev-001"
        type: choice
        options:
          - gcp-sa-dpn-dev-001
          - gcp-sa-dpn-dev-002
          - gcp-sa-dpn-test-001
          - gcp-sa-dpn-test-002

      environment:
        description: "Target Environment"
        required: true
        default: "dev"
        type: choice
        options:
          - dev
          - devtest
          - test

      dpnCluster:
        description: "Target DPN Cluster"
        required: true
        default: "dpn01"
        type: choice
        options:
          - dpn01
          - dpn02

      imageTag:
        description: "Image Tag (Build ID from CI pipeline)"
        required: true
        type: string

      vaultInitEnabled:
        description: "Run Vault Init Job? (first deploy only — only if Vault engines not yet set up)"
        required: true
        type: boolean
        default: false


# =============================================================================
# variables:
# =============================================================================
env:
  CHART_DIR: charts/certificate-manager
  RELEASE_NAME: dpn-certificate-manager
  VALUES_FILE: charts/certificate-manager/values-${{ inputs.environment }}-${{ inputs.dpnCluster }}.yaml
  PARAMETERS_FILE: .pipelines/github-actions-pipelines/gcp-pipelines/config/${{ inputs.environment }}-${{ inputs.dpnCluster }}.json


jobs:

# =============================================================================
# Stage 1 — Validate (Lint + Dry Run)
# =============================================================================
  Validate:
    name: "Validate [${{ inputs.environment }}-${{ inputs.dpnCluster }}]"
    runs-on: ubuntu-latest

    steps:

      # checkout: self
      - name: Checkout
        uses: actions/checkout@v4

      # Load Environment Config
      - name: Load Environment Config
        run: |
          echo "Loading config from: $PARAMETERS_FILE"

          for param in $(jq -r 'keys_unsorted | .[]' "$PARAMETERS_FILE"); do
            value=$(jq -r ".\"$param\"" "$PARAMETERS_FILE")
            echo "$param=$value" >> $GITHUB_ENV
          done

      # Guard — fail early if values file doesn't exist for selected combo
      - name: Check Values File Exists
        run: |
          if [ ! -f "$VALUES_FILE" ]; then
            echo "ERROR: Values file not found: $VALUES_FILE"
            echo "ERROR: dpn02 values files are not yet created."
            echo "ERROR: Please create charts/certificate-manager/values-${{ inputs.environment }}-${{ inputs.dpnCluster }}.yaml first."
            exit 1
          fi
          echo "Values file found: $VALUES_FILE"

      # GCP AUTH + GKE Access
      - name: Authenticate to GCP
        uses: google-github-actions/auth@v2
        with:
          credentials_json: ${{ secrets.GCP_SA_KEY }}

      - name: Setup gcloud CLI
        uses: google-github-actions/setup-gcloud@v2

      - name: Install GKE Auth Plugin (equivalent to kubelogin)
        run: |
          gcloud components install gke-gcloud-auth-plugin -q || true

      - name: Install Helm
        uses: azure/setup-helm@v4

      - name: GKE Auth + Helm Lint + Dry Run
        run: |
          set -euo pipefail

          echo "=========================================="
          echo " INSTALL TOOLS"
          echo "=========================================="
          gcloud version >/dev/null
          helm version >/dev/null
          kubectl version --client >/dev/null
          echo "Tools ready"

          echo "=========================================="
          echo " GKE AUTH"
          echo "=========================================="
          gcloud container clusters get-credentials \
            "$GKE_CLUSTER" \
            --region "$GCP_REGION" \
            --project "$GCP_PROJECT"

          echo "GKE context: $GKE_CLUSTER"

          echo "=========================================="
          echo " HELM LINT"
          echo "=========================================="
          helm lint "$CHART_DIR" -f "$VALUES_FILE" \
            --set image.tag="${{ inputs.imageTag }}"

          echo "=========================================="
          echo " HELM DRY RUN"
          echo "=========================================="
          helm upgrade --install "$RELEASE_NAME" "$CHART_DIR" \
            --namespace "$NAMESPACE" \
            -f "$VALUES_FILE" \
            --set image.tag="${{ inputs.imageTag }}" \
            --set vaultInitJob.enabled=${{ inputs.vaultInitEnabled }} \
            --dry-run

          echo "Validation passed"


# =============================================================================
# Stage 2 — Deploy
# =============================================================================
  Deploy:
    name: "Deploy [${{ inputs.environment }}-${{ inputs.dpnCluster }}]"
    runs-on: ubuntu-latest
    needs: Validate
    
    environment:
      name: certificate-manager-${{ inputs.environment }}      

    steps:

      - name: Checkout
        uses: actions/checkout@v4

      - name: Load Environment Config
        run: |
          echo "Loading config from: $PARAMETERS_FILE"

          for param in $(jq -r 'keys_unsorted | .[]' "$PARAMETERS_FILE"); do
            value=$(jq -r ".\"$param\"" "$PARAMETERS_FILE")
            echo "$param=$value" >> $GITHUB_ENV
          done

      # Authenticate GCP
      - name: Authenticate to GCP
        uses: google-github-actions/auth@v2
        with:
          credentials_json: ${{ secrets.GCP_SA_KEY }}

      - name: Setup gcloud CLI
        uses: google-github-actions/setup-gcloud@v2

      - name: Install Helm
        uses: azure/setup-helm@v4

      - name: Helm Deploy Certificate Manager
        run: |
          set -euo pipefail

          echo "=========================================="
          echo " INSTALL TOOLS"
          echo "=========================================="
          gcloud version >/dev/null
          helm version >/dev/null

          echo "=========================================="
          echo " GKE AUTH"
          echo "=========================================="
          gcloud container clusters get-credentials \
            "$GKE_CLUSTER" \
            --region "$GCP_REGION" \
            --project "$GCP_PROJECT"

          echo "=========================================="
          echo " DEPLOYING CERTIFICATE MANAGER"
          echo " Environment : ${{ inputs.environment }}"
          echo " Cluster     : ${{ inputs.dpnCluster }}"
          echo " GKE         : $GKE_CLUSTER"
          echo " Namespace   : $NAMESPACE"
          echo " Image tag   : ${{ inputs.imageTag }}"
          echo " Values file : $VALUES_FILE"
          echo " Vault Init  : ${{ inputs.vaultInitEnabled }}"
          echo "=========================================="

          helm upgrade --install "$RELEASE_NAME" "$CHART_DIR" \
            --namespace "$NAMESPACE" \
            -f "$VALUES_FILE" \
            --set image.tag="${{ inputs.imageTag }}" \
            --set vaultInitJob.enabled=${{ inputs.vaultInitEnabled }} \
            --wait \
            --timeout 5m

          echo "=========================================="
          echo " POST-DEPLOY STATUS"
          echo "=========================================="
          kubectl get pods -n "$NAMESPACE" -l app=dpn-certificate-manager -o wide
          kubectl get pvc  -n "$NAMESPACE"

          echo "=========================================="
          echo " ROLLING RESTART"
          echo "=========================================="
          kubectl rollout restart deployment/dpn-certificate-manager -n "$NAMESPACE"
          kubectl rollout status  deployment/dpn-certificate-manager -n "$NAMESPACE" --timeout=300s
          echo "Certificate Manager deployed successfully"

      - name: Capture Deployed Image Digest
        run: |
          set -euo pipefail
          CM_DIGEST=$(kubectl get pods -n "$NAMESPACE" \
            -l app=dpn-certificate-manager \
            -o jsonpath='{.items[0].status.containerStatuses[0].imageID}')

          if [ -z "$CM_DIGEST" ]; then
            echo "ERROR: Could not resolve deployed certificate-manager image digest from pod status"
            exit 1
          fi

          echo "Certificate Manager image digest: $CM_DIGEST"

          mkdir -p deployed-digest
          {
            echo "$CM_DIGEST"
            echo "component=certificate-manager"
            echo "environment=${{ inputs.environment }}"
            echo "dpnCluster=${{ inputs.dpnCluster }}"
            echo "imageTag=${{ inputs.imageTag }}"
          } > deployed-digest/certificate-manager-digest.txt

      - name: Publish Deployed Image Digest
        uses: actions/upload-artifact@v4
        with:
          name: deployed-image-digest
          path: deployed-digest/certificate-manager-digest.txt


# =============================================================================
# Stage 3 — Verify
# =============================================================================
  Verify:
    name: "Verify [${{ inputs.environment }}-${{ inputs.dpnCluster }}]"
    runs-on: ubuntu-latest
    needs: Deploy

    steps:

      - name: Checkout
        uses: actions/checkout@v4

      - name: Load Environment Config
        run: |
          echo "Loading config from: $PARAMETERS_FILE"

          for param in $(jq -r 'keys_unsorted | .[]' "$PARAMETERS_FILE"); do
            value=$(jq -r ".\"$param\"" "$PARAMETERS_FILE")
            echo "$param=$value" >> $GITHUB_ENV
          done

      - name: Authenticate to GCP
        uses: google-github-actions/auth@v2
        with:
          credentials_json: ${{ secrets.GCP_SA_KEY }}

      - name: Setup gcloud CLI
        uses: google-github-actions/setup-gcloud@v2

      - name: Rollout + File Share Verification
        run: |
          set -euo pipefail

          gcloud container clusters get-credentials \
            "$GKE_CLUSTER" \
            --region "$GCP_REGION" \
            --project "$GCP_PROJECT"

          echo "=========================================="
          echo " ROLLOUT STATUS"
          echo "=========================================="
          kubectl rollout status deployment/dpn-certificate-manager \
            -n "$NAMESPACE" \
            --timeout=300s

          echo "=========================================="
          echo " POD STATUS"
          echo "=========================================="
          kubectl get pods -n "$NAMESPACE" -l app=dpn-certificate-manager -o wide

          echo "=========================================="
          echo " PVC STATUS"
          echo "=========================================="
          kubectl get pvc -n "$NAMESPACE" -l app.kubernetes.io/name=dpn-certificate-manager

          # (All commented logic preserved exactly from original)

          echo "=========================================="
          echo " CERTIFICATE MANAGER DEPLOYMENT VERIFIED"
          echo "=========================================="