# =============================================================================
# Vault HTTPS CD Pipeline — DPN Platform (GCP Version)
#
# Deploys dpn-vault-https via Helm chart at:
#   charts/vault-https/
#
# Pipeline stages:
#   1. Validate — helm lint + dry-run against target GKE cluster
#   2. Deploy   — helm upgrade --install (gated by GitHub environment approval)
#   3. Verify   — pod + service status + vault seal check
#
# Config resolved from:
#   .pipelines/github-actions-pipelines/gcp-pipelines/config/<env>-<cluster>.json
#   charts/vault-https/values-<env>-<cluster>.yaml
# =============================================================================

name: Vault HTTPS CD Pipeline

on:
  workflow_dispatch:
    inputs:

      ServiceConnection:
        description: "GCP Service Connection"
        required: true
        default: "sc-dpn-dev-002"
        type: choice
        options:
          - sc-dpn-dev-001
          - sc-dpn-dev-002
          - sc-dpn-test-001
          - sc-dpn-test-002

      environment:
        description: "Environment"
        required: true
        default: "dev"
        type: choice
        options:
          - dev
          - devtest
          - test

      dpnCluster:
        description: "Target DPN Cluster"
        required: true
        default: "dpn02"
        type: choice
        options:
          - dpn01
          - dpn02

      vaultImageTag:
        description: "Vault Image Tag (e.g. 1.16)"
        required: true
        default: "1.16"

env:
  CHART_DIR: "charts/vault-https"
  RELEASE_NAME: "vault-https"
  VALUES_FILE: "charts/vault-https/values-${{ inputs.environment }}-${{ inputs.dpnCluster }}.yaml"
  PARAMETERS_FILE: ".pipelines/github-actions-pipelines/gcp-pipelines/config/${{ inputs.environment }}-${{ inputs.dpnCluster }}.json"

# ============================================================
# Stage 1 — Validate
# ============================================================

jobs:

  Validate:
    name: "Lint + Dry Run [${{ inputs.environment }}-${{ inputs.dpnCluster }}]"
    runs-on: ubuntu-latest

    steps:

      - name: checkout
        uses: actions/checkout@v4

      - name: Load Environment Config
        run: |
          echo "Loading config from: $PARAMETERS_FILE"
          for param in $(jq -r 'keys_unsorted | .[]' "$PARAMETERS_FILE"); do
            value=$(jq -r ".\"$param\"" "$PARAMETERS_FILE")
            echo "$param=$value" >> $GITHUB_ENV
          done

      - name: Check Values File Exists
        run: |
          if [ ! -f "$VALUES_FILE" ]; then
            echo "ERROR: Values file not found: $VALUES_FILE"
            exit 1
          fi
          echo "Values file found: $VALUES_FILE"

      # ==========================================
      # GCP AUTH + TOOLING
      # ==========================================
      - name: Authenticate to GCP
        uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: ${{ secrets.GCP_WIF_PROVIDER }}
          service_account: ${{ secrets.GCP_SA }}

      - name: Setup gcloud
        uses: google-github-actions/setup-gcloud@v2

      - name: Install Helm
        uses: azure/setup-helm@v4

      - name: GKE Auth + Helm Lint + Dry Run
        run: |
          set -euo pipefail

          echo "=========================================="
          echo " INSTALL TOOLS"
          echo "=========================================="
          gcloud version
          kubectl version --client
          helm version

          echo "=========================================="
          echo " GKE AUTH"
          echo "=========================================="
          gcloud config set project $GCP_PROJECT

          gcloud container clusters get-credentials \
            $GKE_CLUSTER \
            --region $GCP_REGION

          echo "=========================================="
          echo " HELM LINT"
          echo "=========================================="
          helm lint $CHART_DIR -f $VALUES_FILE \
            --set image.tag="${{ inputs.vaultImageTag }}"

          echo "=========================================="
          echo " HELM DRY RUN"
          echo "=========================================="
          helm upgrade --install $RELEASE_NAME $CHART_DIR \
            --namespace $NAMESPACE \
            --create-namespace \
            -f $VALUES_FILE \
            --set image.tag="${{ inputs.vaultImageTag }}" \
            --dry-run

          echo "Validation passed"

# ============================================================
# Stage 2 — Deploy
# ============================================================

  Deploy:
    name: "Deploy Vault HTTPS [${{ inputs.environment }}-${{ inputs.dpnCluster }}]"
    runs-on: ubuntu-latest
    needs: Validate
    if: success()

    environment:
      name: "vault-https-${{ inputs.environment }}"

    steps:

      - name: checkout
        uses: actions/checkout@v4

      - name: Load Environment Config
        run: |
          for param in $(jq -r 'keys_unsorted | .[]' "$PARAMETERS_FILE"); do
            value=$(jq -r ".\"$param\"" "$PARAMETERS_FILE")
            echo "$param=$value" >> $GITHUB_ENV
          done

      - name: Authenticate to GCP
        uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: ${{ secrets.GCP_WIF_PROVIDER }}
          service_account: ${{ secrets.GCP_SA }}

      - name: Setup gcloud
        uses: google-github-actions/setup-gcloud@v2

      - name: Install Helm
        uses: azure/setup-helm@v4

      - name: Helm Deploy Vault HTTPS
        run: |
          set -euo pipefail

          gcloud config set project $GCP_PROJECT

          gcloud container clusters get-credentials \
            $GKE_CLUSTER \
            --region $GCP_REGION

          echo "=========================================="
          echo " DEPLOYING VAULT HTTPS"
          echo " Environment : ${{ inputs.environment }}"
          echo " Cluster     : ${{ inputs.dpnCluster }}"
          echo " GKE         : $GKE_CLUSTER"
          echo " Namespace   : $NAMESPACE"
          echo " Image tag   : ${{ inputs.vaultImageTag }}"
          echo "=========================================="

          helm upgrade --install $RELEASE_NAME $CHART_DIR \
            --namespace $NAMESPACE \
            -f $VALUES_FILE \
            --set image.tag="${{ inputs.vaultImageTag }}" \
            --wait \
            --timeout 5m

          echo "=========================================="
          echo " POST-DEPLOY STATUS"
          echo "=========================================="
          kubectl get pods -n $NAMESPACE -l app=dpn-vault-https -o wide
          kubectl get svc  -n $NAMESPACE -l app=dpn-vault-https

          echo "Vault HTTPS deployed successfully"

      - name: Capture Deployed Image Digest
        run: |
          set -euo pipefail
          VAULT_DIGEST=$(kubectl get pods -n $NAMESPACE \
            -l app=dpn-vault-https \
            -o jsonpath='{.items[0].status.containerStatuses[0].imageID}')

          if [ -z "$VAULT_DIGEST" ]; then
            echo "ERROR: Could not resolve deployed vault-https image digest from pod status"
            exit 1
          fi

          echo "Vault HTTPS image digest: $VAULT_DIGEST"

          mkdir -p deployed-digest
          {
            echo "$VAULT_DIGEST"
            echo "component=vault-https"
            echo "environment=${{ inputs.environment }}"
            echo "dpnCluster=${{ inputs.dpnCluster }}"
            echo "imageTag=${{ inputs.vaultImageTag }}"
          } > deployed-digest/vault-https-digest.txt

      - name: Publish Deployed Image Digest
        uses: actions/upload-artifact@v4
        with:
          name: deployed-image-digest
          path: deployed-digest/vault-https-digest.txt

# ============================================================
# Stage 3 — Verify
# ============================================================

  Verify:
    name: "Verify Vault HTTPS [${{ inputs.environment }}-${{ inputs.dpnCluster }}]"
    runs-on: ubuntu-latest
    needs: Deploy
    if: success()

    steps:

      - name: checkout
        uses: actions/checkout@v4

      - name: Load Environment Config
        run: |
          for param in $(jq -r 'keys_unsorted | .[]' "$PARAMETERS_FILE"); do
            value=$(jq -r ".\"$param\"" "$PARAMETERS_FILE")
            echo "$param=$value" >> $GITHUB_ENV
          done

      - name: Authenticate to GCP
        uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: ${{ secrets.GCP_WIF_PROVIDER }}
          service_account: ${{ secrets.GCP_SA }}

      - name: Setup gcloud
        uses: google-github-actions/setup-gcloud@v2

      - name: Vault HTTPS Seal Status Check (GKE)
        run: |
          set -euo pipefail

          gcloud config set project $GCP_PROJECT

          gcloud container clusters get-credentials \
            $GKE_CLUSTER \
            --region $GCP_REGION

          echo "=========================================="
          echo " POD STATUS"
          echo "=========================================="
          kubectl get pods -n $NAMESPACE -l app=dpn-vault-https -o wide

          echo "=========================================="
          echo " SERVICE STATUS"
          echo "=========================================="
          kubectl get svc -n $NAMESPACE -l app=dpn-vault-https

          echo "=========================================="
          echo " VAULT HTTPS SEAL STATUS"
          echo "=========================================="

          VAULT_POD=$(kubectl get pod -n $NAMESPACE -l app=dpn-vault-https \
            -o jsonpath='{.items[0].metadata.name}')

          echo "Pod: $VAULT_POD"

          kubectl exec -n $NAMESPACE $VAULT_POD -- \
            sh -c 'VAULT_ADDR=https://127.0.0.1:8200 VAULT_SKIP_VERIFY=true vault status || true'

          echo "Verification complete"