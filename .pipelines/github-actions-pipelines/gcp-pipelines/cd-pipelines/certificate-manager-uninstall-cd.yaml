name: DPN Certificate Manager Uninstall Pipeline

# =============================================================================
# trigger: none
# =============================================================================
on:
  workflow_dispatch:
    inputs:

      # =====================================================
      # parameters:
      # =====================================================

      ServiceConnection:
        description: "GCP Service Account"
        type: choice
        default: "gcp-sa-dpn-dev-001"
        options:
          - gcp-sa-dpn-dev-001    # dev  — equivalent of sc-dpn-dev-001
          - gcp-sa-dpn-dev-002    # dev  — equivalent of sc-dpn-dev-002
          - gcp-sa-dpn-test-001   # test — equivalent of sc-dpn-test-001
          - gcp-sa-dpn-test-002   # test — equivalent of sc-dpn-test-002

      environment:
        description: "Target Environment"
        type: choice
        default: dev
        options:
          - dev
          - devtest
          - test

      cluster:
        description: "Target DPN Cluster"
        type: choice
        default: dpn01
        options:
          - dpn01
          - dpn02


# =====================================================
# Variables
# =====================================================
env:
  PARAMETERS_FILE: .pipelines/github-actions-pipelines/gcp-pipelines/${{ inputs.environment }}-${{ inputs.cluster }}.json


jobs:

# -----------------------------------------------------
# Stage 0 — Pre-Uninstall Checklist
# -----------------------------------------------------
  Precheck:
    name: "Pre-Uninstall Checklist"
    runs-on: ubuntu-latest

    steps:
      - name: Operator Confirmation
        run: |
          echo "PRE-UNINSTALL CHECKLIST"
          echo "--------------------------------------------------"
          echo "Confirm ALL of the following BEFORE proceeding:"
          echo ""
          echo "All Federator CI pipelines are disabled"
          echo "All Federator CD pipelines are disabled"
          echo "No active file or data ingestion is running"
          echo "Kafka topics are drained or validated"
          echo "Required backups have been completed"
          echo ""
          echo "Uninstall must NOT proceed unless all checks pass."


# -----------------------------------------------------
# Stage 1 — Prepare (Load Config + GKE Auth)
# -----------------------------------------------------
  Prepare:
    name: "Load Configuration & GKE Context"
    runs-on: ubuntu-latest
    needs: Precheck

    steps:

      - name: Checkout
        uses: actions/checkout@v4

      - name: Load Environment Config
        run: |
          echo "Loading config from: $PARAMETERS_FILE"
          for param in $(jq -r 'keys_unsorted | .[]' "$PARAMETERS_FILE"); do
            value=$(jq -r ".\"$param\"" "$PARAMETERS_FILE")
            echo "$param=$value" >> $GITHUB_ENV
          done

      # GCP equivalent
      - name: Authenticate to GCP
        uses: google-github-actions/auth@v2
        with:
          credentials_json: ${{ secrets.GCP_SA_KEY }}

      - name: Setup gcloud CLI
        uses: google-github-actions/setup-gcloud@v2

      - name: GKE Authentication
        run: |
          set -euo pipefail
          gcloud container clusters get-credentials \
            "$GKE_CLUSTER" \
            --region "$GCP_REGION" \
            --project "$GCP_PROJECT"


# -----------------------------------------------------
# Stage 2 — Approval (Explicit Deletion Scope)
# -----------------------------------------------------
  Approval:
    name: "Approval – Confirm Deletion Scope"
    runs-on: ubuntu-latest
    needs: Prepare

    environment: "certificate-manager-${{ inputs.environment }}"

    steps:

      - name: Checkout
        uses: actions/checkout@v4

      - name: Approval Context Header
        run: |
          echo "===================================================="
          echo "DPN PLATFORM UNINSTALL — APPROVAL REQUIRED"
          echo "===================================================="
          echo ""
          echo "The following Helm releases WILL be deleted"
          echo "ONCE APPROVAL IS GRANTED:"
          echo ""
          echo "Filtering rule:"
          echo "  Helm releases starting with: dpn-certificate-manager"
          echo ""

      - name: Load Environment Config
        run: |
          echo "Loading config from: $PARAMETERS_FILE"
          for param in $(jq -r 'keys_unsorted | .[]' "$PARAMETERS_FILE"); do
            value=$(jq -r ".\"$param\"" "$PARAMETERS_FILE")
            echo "$param=$value" >> $GITHUB_ENV
          done
      
      - name: Authenticate to GCP
        uses: google-github-actions/auth@v2
        with:
          credentials_json: ${{ secrets.GCP_SA_KEY }}

      - name: Setup gcloud CLI
        uses: google-github-actions/setup-gcloud@v2

      - name: Install Helm
        uses: azure/setup-helm@v4

      - name: Preview Helm Releases (READ‑ONLY)
        run: |
          set -euo pipefail

          gcloud container clusters get-credentials \
            "$GKE_CLUSTER" \
            --region "$GCP_REGION" \
            --project "$GCP_PROJECT"

          echo ""
          echo "Helm releases that will be deleted:"
          echo "----------------------------------------------------"

          helm list -n "$NAMESPACE" -q \
          | grep '^dpn-certificate-manager' || echo "None found" \
          | while read -r release; do
            echo "Uninstalling Helm release: $release"
          done

          echo ""
          echo "----------------------------------------------------"
          echo "NO resources have been deleted in this stage."
          echo "Deletion will occur ONLY after approval."
          echo "===================================================="


# -----------------------------------------------------
# Stage 3 — Helm Uninstall (Component Level)
# -----------------------------------------------------
  Uninstall:
    name: "Uninstall DPN Components"
    runs-on: ubuntu-latest
    needs: Approval

    steps:

      - name: Checkout
        uses: actions/checkout@v4

      - name: Reload Environment Variables
        run: |
          CONFIG_FILE="$PARAMETERS_FILE"
          for key in $(jq -r 'keys_unsorted | .[]' "$CONFIG_FILE"); do
            value=$(jq -r ".\"$key\"" "$CONFIG_FILE")
            echo "$key=$value" >> $GITHUB_ENV
          done

      # Authenticate to GCP 
      - name: Authenticate to GCP
        uses: google-github-actions/auth@v2
        with:
          credentials_json: ${{ secrets.GCP_SA_KEY }}

      - name: Setup gcloud CLI
        uses: google-github-actions/setup-gcloud@v2

      - name: Install Helm
        uses: azure/setup-helm@v4

      - name: Helm Uninstall Components
        run: |
          set -euo pipefail
          gcloud container clusters get-credentials \
            "$GKE_CLUSTER" \
            --region "$GCP_REGION" \
            --project "$GCP_PROJECT"

          echo "Uninstalling Helm releases in namespace: $NAMESPACE"

          helm list -n "$NAMESPACE" -q \
          | grep '^dpn-certificate-manager' \
          | while read -r release; do
            echo "Uninstalling Helm release: $release"
            helm uninstall "$release" -n "$NAMESPACE"
          done


# -----------------------------------------------------
# Stage 4 — Final Verification
# -----------------------------------------------------
  Verify:
    name: "Final Verification"
    runs-on: ubuntu-latest
    needs: Uninstall

    steps:

      - name: Checkout
        uses: actions/checkout@v4

      - name: Load Environment Variables
        run: |
          set -e

          CONFIG_FILE="$PARAMETERS_FILE"
          if [ ! -f "$CONFIG_FILE" ]; then
            echo "ERROR: Config file not found: $CONFIG_FILE"
            exit 1
          fi

          for key in $(jq -r 'keys_unsorted | .[]' "$CONFIG_FILE"); do
            value=$(jq -r ".\"$key\"" "$CONFIG_FILE")
            echo "$key=$value" >> $GITHUB_ENV
            echo "Loaded $key=$value"
          done

      # Authenticate to GCP
      - name: Authenticate to GCP
        uses: google-github-actions/auth@v2
        with:
          credentials_json: ${{ secrets.GCP_SA_KEY }}

      - name: Setup gcloud CLI
        uses: google-github-actions/setup-gcloud@v2

      - name: Install Helm
        uses: azure/setup-helm@v4

      - name: AKS Authentication (converted to GKE Authentication)
        run: |
          set -euo pipefail

          gcloud container clusters get-credentials \
            "$GKE_CLUSTER" \
            --region "$GCP_REGION" \
            --project "$GCP_PROJECT"

      - name: Verification Output
        run: |
          echo "Deployments:"
          kubectl get deployments -n "$NAMESPACE"

          echo "Pods:"
          kubectl get pods -n "$NAMESPACE"

          echo "Helm Releases:"
          helm list -n "$NAMESPACE"

          echo "Services (should still exist):"
          kubectl get svc -n "$NAMESPACE"