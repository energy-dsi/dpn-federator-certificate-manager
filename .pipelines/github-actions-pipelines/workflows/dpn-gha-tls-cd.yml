name: DPN CD - Prerequisite Pipeline (AWS Universal TLS) #1

# =============================================================================
# DPN CD - Prerequisite Pipeline (AWS Universal TLS) #1 — DPN Platform (multi-cloud)
# UNIFIED: Vault + Keycloak + Kafka + federator
#
# ONE self-signed DPN Root CA (dpn-root) and ONE common server cert (CN=dpn-common,
# wildcard SANs) generated by create-dpn-tls.sh, then published in every format /
# secret the platform needs. In ONE run it:
#
#   - generates the universal material (PEM + keystore.jks + truststore.jks + client p12)
#   - Cloud secrets backend (Azure Key Vault or AWS Secrets Manager, +355-day expiry
#     on Azure / no native expiry on AWS) — cert-derived password VALUES that the
#     downstream SecretProviderClasses (vault-https, certificate-manager, keycloak,
#     kafka) read:
#       VAULT-TLS-CERT / VAULT_TLS_CERT                   <- certs/server.crt (Vault HTTPS server cert)
#       VAULT-TLS-KEY / VAULT_TLS_KEY                      <- certs/server.key (Vault HTTPS server key)
#       VAULT-TRUSTSTORE-PASSWORD / VAULT_TRUSTSTORE_PASSWORD <- truststore password
#       KC-HTTPS-KEY-STORE-PASSWORD / KC_HTTPS_KEY_STORE_PASSWORD     <- keystore password
#       KC-HTTPS-TRUST-STORE-PASSWORD / KC_HTTPS_TRUST_STORE_PASSWORD <- truststore password
#       KC-SPI-TRUSTSTORE-FILE-PASSWORD / KC_SPI_TRUSTSTORE_FILE_PASSWORD <- truststore password
#       UNIVERSAL-DPN-CERT-PASSWORD / UNIVERSAL_DPN_CERT_PASSWORD      <- keystore password
#       DSM-CLIENT-P12-PASSWORD / DSM_CLIENT_P12_PASSWORD              <- dsm-client.p12 password
#     On AWS these are stored one-per-secret under dpn/<environment>-<cluster>/<component>/<KEY>
#     (see the "Publish to AWS Secrets Manager" step for the exact component prefixes).
#   - K8s secrets (cert-material files, created directly here):
#       cert-manager-truststore (truststore.jks)             -> cert-manager trusts Vault   [ns-dpn-01]
#       dpn-tls (ca.crt + keystore.jks + truststore.jks)     -> Keycloak + Kafka + federator [targetNamespace]
#       fed-gateway-tls (tls.crt + tls.key)                  -> federator gateway browser HTTPS [targetNamespace]
#       dpn-health-tls (tls.crt + tls.key + ca.crt, kubernetes.io/tls) -> oauth2-proxy observability gateways [ns-dpn-health-01] + Airflow webserver HTTPS [targetNamespace]
#
# NOT handled here (by design):
#   - kafka-secrets / dpn-keycloak-secrets K8s secrets are created by the gateway /
#     dpn-authentication-service SecretProviderClasses from the cloud secrets backend values above.
#   - KEYCLOAK-ADMIN-PASSWORD, KC-DB-PASSWORD, KAFKA-OAUTH-CLIENT-SECRET are NOT cert
#     material — the operator sets those in the secrets backend MANUALLY.
#
# Because Vault, Keycloak, Kafka and cert-manager all derive from ONE dpn-root in a
# single run, the Vault cert and the truststores are consistent BY CONSTRUCTION.
# FIRST cutover is coordinated: restart Vault, cert-manager, Keycloak, both Kafka
# brokers and both federators so they pick up the new material.
#
# Password contract (kept consistent on purpose):
#   keystore.jks   password == KC-HTTPS-KEY-STORE-PASSWORD == UNIVERSAL-DPN-CERT-PASSWORD
#   truststore.jks password == KC-HTTPS-TRUST-STORE-PASSWORD == VAULT-TRUSTSTORE-PASSWORD
#                           == KC-SPI-TRUSTSTORE-FILE-PASSWORD
#
# Config resolved from: .github/config/<cloud>/<environment>-<cluster>.json
# TLS generator script: .github/config/scripts/create-dpn-tls.sh (cloud-agnostic)
#
# No approval gate for this POC — add GitHub Environment protection rules
# (Settings -> Environments -> required reviewers) before this goes past POC.
#
# Required repository secrets (Settings -> Secrets and variables -> Actions):
#   DPN_TLS_KEYSTORE_PASSWORD    — keystore.jks password
#   DPN_TLS_TRUSTSTORE_PASSWORD  — truststore.jks password
#   DPN_TLS_CLIENT_P12_PASSWORD  — dsm-client.p12 password
# workflow_dispatch has no secret-typed input, so these are never taken as
# plain-text inputs — they must be pre-configured as repo/environment secrets.
#
# GCP is a future plan — not yet implemented.
# =============================================================================

on:
  workflow_dispatch:
    inputs:
      cloud:
        description: "Target Cloud Provider"
        required: true
        default: "aws"
        type: choice
        options:
          - azure
          - aws
          - gcp

      environment:
        description: "Select Environment"
        required: true
        default: "test"
        type: choice
        options:
          - dev
          - test

      cluster:
        description: "Target DPN Cluster"
        required: true
        default: "dpn01"
        type: choice
        options:
          - dpn01
          - dpn02

      targetNamespace:
        description: "Namespace for dpn-tls + fed-gateway-tls (where Keycloak/Kafka/federator run)"
        required: true
        default: "ns-dpn-01"
        type: choice
        options:
          - ns-dpn-01
          - ns-dpn-health-01

      country:
        description: "Country (C)"
        required: true
        default: "GB"
        type: string

      org:
        description: "Organisation (O)"
        required: true
        default: "DSI"
        type: string

      storePasswordsInSecretsBackend:
        description: "Also store the cert/store passwords in the cloud secrets backend?"
        required: true
        default: true
        type: boolean

      createHealthTls:
        description: "Also create dpn-health-tls (3-key kubernetes.io/tls) in ns-dpn-health-01?"
        required: true
        default: true
        type: boolean

env:
  PARAMETERS_FILE: .github/config/${{ inputs.cloud }}/${{ inputs.environment }}-${{ inputs.cluster }}.json
  TLS_SCRIPT: .github/config/scripts/create-dpn-tls.sh
  HUB_ROLE_ARN: <<your specific value>>

permissions:
  id-token: write
  contents: read

jobs:
  generate-tls:
    name: AWS Universal TLS - Generate + Publish Secrets + K8s Secrets
    runs-on: [self-hosted, vmss]
    environment: ${{ inputs.environment }}-${{ inputs.cluster }}
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Read Deployment Config
        shell: bash
        run: |
          set -euo pipefail

          if [ ! -f "${PARAMETERS_FILE}" ]; then
            echo "ERROR: ${PARAMETERS_FILE} not found!"
            exit 1
          fi

          echo "Loading config from ${PARAMETERS_FILE}"
          for key in $(jq -r 'keys_unsorted[]' "${PARAMETERS_FILE}"); do
            value=$(jq -r ".\"$key\"" "${PARAMETERS_FILE}")
            echo "${key}=${value}" >> "$GITHUB_ENV"
            echo "Set ${key}"
          done

          echo "SECRET_PREFIX=dpn/${{ inputs.environment }}-${{ inputs.cluster }}" >> "$GITHUB_ENV"

      ###################################################################
      # CLOUD AUTH
      ###################################################################
      - name: Azure Login (OIDC)
        if: ${{ inputs.cloud == 'azure' }}
        shell: bash
        env:
          AZURE_CLIENT_ID: ${{ secrets.AZURE_CLIENT_ID }}
          AZURE_TENANT_ID: ${{ secrets.AZURE_TENANT_ID }}
        run: |
          set -euo pipefail

          OIDC_TOKEN=$(curl -sS \
            -H "Authorization: bearer $ACTIONS_ID_TOKEN_REQUEST_TOKEN" \
            "${ACTIONS_ID_TOKEN_REQUEST_URL}&audience=api://AzureADTokenExchange" \
            | jq -r '.value')

          az login \
            --service-principal \
            --username "$AZURE_CLIENT_ID" \
            --tenant "$AZURE_TENANT_ID" \
            --federated-token "$OIDC_TOKEN"

          az account set --subscription "$ARM_SUBSCRIPTION_ID"
          az account show

      - name: Configure AWS credentials (OIDC bootstrap role)
        if: ${{ inputs.cloud == 'aws' }}
        uses: aws-actions/configure-aws-credentials@v6
        with:
          role-to-assume: ${{ env.HUB_ROLE_ARN }}
          role-session-name: gha-oidc-bootstrap
          aws-region: ${{ env.AWS_REGION }}

      - name: Assume target account role
        if: ${{ inputs.cloud == 'aws' }}
        uses: aws-actions/configure-aws-credentials@v6
        with:
          role-chaining: true
          role-to-assume: arn:aws:iam::${{ env.AWS_ACCOUNT_ID }}:role/oidc_github_runner_admin
          role-session-name: gha-target-account
          aws-region: ${{ env.AWS_REGION }}

      - name: Ensure AWS CLI is installed
        if: ${{ inputs.cloud == 'aws' }}
        run: |
          export PATH="$HOME/.local/bin:$PATH"
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"
          if command -v aws >/dev/null 2>&1; then
            aws --version
            exit 0
          fi
          curl -fsSL "https://awscli.amazonaws.com/awscli-exe-linux-x86_64.zip" -o "awscliv2.zip"
          unzip -q awscliv2.zip
          ./aws/install --bin-dir "$HOME/.local/bin" --install-dir "$HOME/.aws-cli" --update

      - name: Verify AWS identity
        if: ${{ inputs.cloud == 'aws' }}
        run: aws sts get-caller-identity

      ###################################################################
      # INSTALL TOOLS
      ###################################################################
      - name: Setup kubectl
        uses: azure/setup-kubectl@v4
        with:
          version: 'v1.32.4'

      - name: Setup kubelogin
        if: ${{ inputs.cloud == 'azure' }}
        uses: Azure/use-kubelogin@v1
        with:
          kubelogin-version: 'v0.1.4'

      - name: Verify Tools
        run: kubectl version --client

      # keytool is REQUIRED to build keystore.jks/truststore.jks that Java (Keycloak/Kafka) accepts.
      - name: Setup Java (keytool)
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      ###################################################################
      # GENERATE DPN UNIVERSAL TLS (self-signed, wildcard SANs)
      ###################################################################
      - name: Generate AWS Universal TLS material
        shell: bash
        run: |
          set -euo pipefail

          OUT_DIR="$GITHUB_WORKSPACE/dpn-tls"
          echo "OUT_DIR=$OUT_DIR" >> "$GITHUB_ENV"

          COUNTRY="${{ inputs.country }}" \
          ORG="${{ inputs.org }}" \
          KEYSTORE_PASS="${{ secrets.DPN_TLS_KEYSTORE_PASSWORD }}" \
          TRUSTSTORE_PASS="${{ secrets.DPN_TLS_TRUSTSTORE_PASSWORD }}" \
          CLIENT_P12_PASS="${{ secrets.DPN_TLS_CLIENT_P12_PASSWORD }}" \
          OUT_DIR="$OUT_DIR" \
          sh "$TLS_SCRIPT"

      ###################################################################
      # PUBLISH TO AZURE KEY VAULT
      ###################################################################
      - name: Publish TLS material + passwords to Azure Key Vault
        if: ${{ inputs.cloud == 'azure' }}
        shell: bash
        run: |
          set -euo pipefail

          KEYSTORE_PASS="${{ secrets.DPN_TLS_KEYSTORE_PASSWORD }}"
          TRUSTSTORE_PASS="${{ secrets.DPN_TLS_TRUSTSTORE_PASSWORD }}"
          CLIENT_P12_PASS="${{ secrets.DPN_TLS_CLIENT_P12_PASSWORD }}"

          EXPIRY="$(date -u -d '+355 days' '+%Y-%m-%d')T00:00:00Z"
          echo "Secret expiry: $EXPIRY"

          echo "=========================================="
          echo " PUBLISH VAULT PEM + PASSWORDS TO KEY VAULT $KEY_VAULT_NAME"
          echo "=========================================="
          az keyvault secret set --vault-name "$KEY_VAULT_NAME" --name VAULT-TLS-CERT --file "$OUT_DIR/certs/server.crt" --expires "$EXPIRY" --output none
          az keyvault secret set --vault-name "$KEY_VAULT_NAME" --name VAULT-TLS-KEY  --file "$OUT_DIR/certs/server.key" --expires "$EXPIRY" --output none

          if [ "${{ inputs.storePasswordsInSecretsBackend }}" = "true" ]; then
            # Object names MATCH what the SecretProviderClasses read:
            #   cert-manager (certificate-manager-secrets): VAULT-TRUSTSTORE-PASSWORD
            #   gateway (kafka-secrets):  KC-HTTPS-KEY-STORE-PASSWORD, KC-HTTPS-TRUST-STORE-PASSWORD, UNIVERSAL-DPN-CERT-PASSWORD
            #   auth-svc (dpn-keycloak-secrets): KC-HTTPS-KEY-STORE-PASSWORD, KC-HTTPS-TRUST-STORE-PASSWORD
            # NOT written here (manual): KEYCLOAK-ADMIN-PASSWORD, KC-DB-PASSWORD, KAFKA-OAUTH-CLIENT-SECRET
            az keyvault secret set --vault-name "$KEY_VAULT_NAME" --name VAULT-TRUSTSTORE-PASSWORD       --value "$TRUSTSTORE_PASS" --expires "$EXPIRY" --output none
            az keyvault secret set --vault-name "$KEY_VAULT_NAME" --name KC-HTTPS-KEY-STORE-PASSWORD     --value "$KEYSTORE_PASS"   --expires "$EXPIRY" --output none
            az keyvault secret set --vault-name "$KEY_VAULT_NAME" --name KC-HTTPS-TRUST-STORE-PASSWORD   --value "$TRUSTSTORE_PASS" --expires "$EXPIRY" --output none
            az keyvault secret set --vault-name "$KEY_VAULT_NAME" --name KC-SPI-TRUSTSTORE-FILE-PASSWORD --value "$TRUSTSTORE_PASS" --expires "$EXPIRY" --output none
            az keyvault secret set --vault-name "$KEY_VAULT_NAME" --name UNIVERSAL-DPN-CERT-PASSWORD     --value "$KEYSTORE_PASS"   --expires "$EXPIRY" --output none
            az keyvault secret set --vault-name "$KEY_VAULT_NAME" --name DSM-CLIENT-P12-PASSWORD         --value "$CLIENT_P12_PASS" --expires "$EXPIRY" --output none
            echo "Stored VAULT-TLS-*, VAULT-TRUSTSTORE-PASSWORD, KC-*, UNIVERSAL-DPN-CERT-PASSWORD and DSM-CLIENT-P12-PASSWORD."
            echo "Reminder: set KEYCLOAK-ADMIN-PASSWORD, KC-DB-PASSWORD, KAFKA-OAUTH-CLIENT-SECRET in Key Vault manually."
          else
            echo "Stored VAULT-TLS-CERT / VAULT-TLS-KEY only (storePasswordsInSecretsBackend=false)."
          fi

      ###################################################################
      # PUBLISH TO AWS SECRETS MANAGER
      ###################################################################
      - name: Publish TLS material + passwords to AWS Secrets Manager
        if: ${{ inputs.cloud == 'aws' }}
        shell: bash
        run: |
          set -euo pipefail

          KEYSTORE_PASS="${{ secrets.DPN_TLS_KEYSTORE_PASSWORD }}"
          TRUSTSTORE_PASS="${{ secrets.DPN_TLS_TRUSTSTORE_PASSWORD }}"
          CLIENT_P12_PASS="${{ secrets.DPN_TLS_CLIENT_P12_PASSWORD }}"

          # $1 = secret name, $2 = --secret-string or --secret-binary, $3 = value
          put_secret() {
            local name="$1" flag="$2" value="$3"
            if aws secretsmanager describe-secret --secret-id "$name" >/dev/null 2>&1; then
              aws secretsmanager put-secret-value --secret-id "$name" "$flag" "$value" >/dev/null
            else
              aws secretsmanager create-secret --name "$name" "$flag" "$value" >/dev/null
            fi
          }

          echo "=========================================="
          echo " PUBLISH VAULT PEM MATERIAL -> Secrets Manager"
          echo "=========================================="
          put_secret "$SECRET_PREFIX/vault-https/VAULT_TLS_CERT" --secret-binary "fileb://$OUT_DIR/certs/server.crt"
          put_secret "$SECRET_PREFIX/vault-https/VAULT_TLS_KEY"  --secret-binary "fileb://$OUT_DIR/certs/server.key"

          if [ "${{ inputs.storePasswordsInSecretsBackend }}" = "true" ]; then
            # Object names MATCH what the SecretProviderClasses read:
            #   cert-manager: certificate-manager/VAULT_TRUSTSTORE_PASSWORD
            #   vault-https:  vault-https/VAULT_TRUSTSTORE_PASSWORD
            #   keycloak:     keycloak/KC_HTTPS_KEY_STORE_PASSWORD, keycloak/KC_HTTPS_TRUST_STORE_PASSWORD
            #   kafka:        kafka/UNIVERSAL_DPN_CERT_PASSWORD
            # NOT written here (manual): KEYCLOAK_ADMIN_PASSWORD, KC_DB_PASSWORD, KAFKA_OAUTH_CLIENT_SECRET
            put_secret "$SECRET_PREFIX/certificate-manager/VAULT_TRUSTSTORE_PASSWORD" --secret-string "$TRUSTSTORE_PASS"
            put_secret "$SECRET_PREFIX/vault-https/VAULT_TRUSTSTORE_PASSWORD"         --secret-string "$TRUSTSTORE_PASS"
            put_secret "$SECRET_PREFIX/keycloak/KC_HTTPS_KEY_STORE_PASSWORD"          --secret-string "$KEYSTORE_PASS"
            put_secret "$SECRET_PREFIX/keycloak/KC_HTTPS_TRUST_STORE_PASSWORD"        --secret-string "$TRUSTSTORE_PASS"
            put_secret "$SECRET_PREFIX/keycloak/KC_SPI_TRUSTSTORE_FILE_PASSWORD"      --secret-string "$TRUSTSTORE_PASS"
            put_secret "$SECRET_PREFIX/kafka/UNIVERSAL_DPN_CERT_PASSWORD"             --secret-string "$KEYSTORE_PASS"
            put_secret "$SECRET_PREFIX/dsm-client/DSM_CLIENT_P12_PASSWORD"            --secret-string "$CLIENT_P12_PASS"
            echo "Stored vault-https/VAULT_TLS_*, */VAULT_TRUSTSTORE_PASSWORD, keycloak/KC_*, kafka/UNIVERSAL_DPN_CERT_PASSWORD and dsm-client/DSM_CLIENT_P12_PASSWORD."
            echo "Reminder: set KEYCLOAK_ADMIN_PASSWORD, KC_DB_PASSWORD, KAFKA_OAUTH_CLIENT_SECRET in Secrets Manager manually."
          else
            echo "Stored vault-https/VAULT_TLS_CERT / VAULT_TLS_KEY only (storePasswordsInSecretsBackend=false)."
          fi

      ###################################################################
      # CLUSTER CONTEXT (AKS or EKS)
      ###################################################################
      - name: AKS Context
        if: ${{ inputs.cloud == 'azure' }}
        shell: bash
        run: |
          set -euo pipefail

          az aks get-credentials \
            --resource-group "$RESOURCE_GROUP" \
            --name "$AKS_CLUSTER" \
            --overwrite-existing

          kubelogin convert-kubeconfig -l azurecli

          if ! timeout 30 kubectl get ns >/dev/null; then
            echo "::error::Could not reach the AKS API server for $AKS_CLUSTER within 30s."
            echo "::group::DEBUG - cluster show"
            az aks show --resource-group "$RESOURCE_GROUP" --name "$AKS_CLUSTER" \
              --query "{provisioningState:provisioningState,powerState:powerState,privateFQDN:apiServerAccessProfile.enablePrivateCluster}" || true
            echo "::endgroup::"
            exit 1
          fi
          echo "AKS context ready"

      - name: EKS Context
        if: ${{ inputs.cloud == 'aws' }}
        shell: bash
        run: |
          set -euo pipefail

          aws eks update-kubeconfig \
            --region "$AWS_REGION" \
            --name "$EKS_CLUSTER"

          if ! timeout 30 kubectl get ns >/dev/null; then
            echo "::error::Could not reach the EKS API server for $EKS_CLUSTER within 30s."
            echo "::error::This is almost always a network-reachability issue (runner not routed to this cluster's VPC), not a workflow bug."

            echo "::group::DEBUG - cluster describe"
            aws eks describe-cluster --region "$AWS_REGION" --name "$EKS_CLUSTER" \
              --query "cluster.{status:status,endpoint:endpoint,endpointPublicAccess:resourcesVpcConfig.endpointPublicAccess,endpointPrivateAccess:resourcesVpcConfig.endpointPrivateAccess,publicAccessCidrs:resourcesVpcConfig.publicAccessCidrs,vpcId:resourcesVpcConfig.vpcId}" || true
            echo "::endgroup::"

            echo "::group::DEBUG - current kubeconfig context"
            kubectl config current-context || true
            kubectl config view --minify || true
            echo "::endgroup::"

            exit 1
          fi
          echo "EKS context ready"

      ###################################################################
      # K8s SECRETS (cert-material files, created directly — cloud-agnostic)
      ###################################################################
      - name: Create K8s Secret — cert-manager-truststore
        shell: bash
        run: |
          set -euo pipefail

          echo "=========================================="
          echo " K8s SECRET cert-manager-truststore (ns=$NAMESPACE)"
          echo "=========================================="
          # delete+create (not dry-run|apply) so the base64 truststore is NOT printed to the log
          kubectl delete secret cert-manager-truststore -n "$NAMESPACE" --ignore-not-found >/dev/null 2>&1
          if ! kubectl create secret generic cert-manager-truststore \
            --namespace "$NAMESPACE" \
            --from-file=truststore.jks="$OUT_DIR/truststore.jks"; then
            echo "::error::Failed to create cert-manager-truststore secret in namespace $NAMESPACE."
            echo "::group::DEBUG - namespace + existing secrets"
            kubectl get ns "$NAMESPACE" || true
            kubectl get secrets -n "$NAMESPACE" || true
            echo "::endgroup::"
            exit 1
          fi
          echo "Secret 'cert-manager-truststore' created/updated in namespace $NAMESPACE."

      - name: Create K8s Secret — dpn-tls
        shell: bash
        run: |
          set -euo pipefail

          echo "=========================================="
          echo " K8s SECRET dpn-tls (ca.crt + keystore.jks + truststore.jks, ns=${{ inputs.targetNamespace }})"
          echo "=========================================="
          # GENERIC secret: Keycloak mounts it at /cert; Kafka brokers + federator mount it at /etc/kafka/secrets.
          # ca.crt = the dpn-root CA cert (matches the deployed dpn-tls shape).
          kubectl delete secret dpn-tls -n "${{ inputs.targetNamespace }}" --ignore-not-found >/dev/null 2>&1
          if ! kubectl create secret generic dpn-tls \
            --namespace "${{ inputs.targetNamespace }}" \
            --from-file=ca.crt="$OUT_DIR/ca/dpn-root.crt" \
            --from-file=keystore.jks="$OUT_DIR/keystore.jks" \
            --from-file=truststore.jks="$OUT_DIR/truststore.jks"; then
            echo "::error::Failed to create dpn-tls secret in namespace ${{ inputs.targetNamespace }}."
            echo "::group::DEBUG - namespace + existing secrets"
            kubectl get ns "${{ inputs.targetNamespace }}" || true
            kubectl get secrets -n "${{ inputs.targetNamespace }}" || true
            echo "::endgroup::"
            exit 1
          fi
          echo "Secret 'dpn-tls' (ca.crt + keystore.jks + truststore.jks) created/updated in namespace ${{ inputs.targetNamespace }}."

      - name: Create K8s Secret — fed-gateway-tls
        shell: bash
        run: |
          set -euo pipefail

          echo "=========================================="
          echo " K8s SECRET fed-gateway-tls (kubernetes.io/tls, ns=${{ inputs.targetNamespace }})"
          echo "=========================================="
          # tls.crt/tls.key = the universal server.crt/server.key (federator gateway browser HTTPS).
          kubectl delete secret fed-gateway-tls -n "${{ inputs.targetNamespace }}" --ignore-not-found >/dev/null 2>&1
          if ! kubectl create secret tls fed-gateway-tls \
            --namespace "${{ inputs.targetNamespace }}" \
            --cert="$OUT_DIR/certs/server.crt" \
            --key="$OUT_DIR/certs/server.key"; then
            echo "::error::Failed to create fed-gateway-tls secret in namespace ${{ inputs.targetNamespace }}."
            echo "::group::DEBUG - namespace + existing secrets"
            kubectl get ns "${{ inputs.targetNamespace }}" || true
            kubectl get secrets -n "${{ inputs.targetNamespace }}" || true
            echo "::endgroup::"
            exit 1
          fi
          echo "Secret 'fed-gateway-tls' (tls.crt + tls.key) created/updated in namespace ${{ inputs.targetNamespace }}."

      - name: Create K8s Secret — dpn-health-tls
        if: ${{ inputs.createHealthTls }}
        shell: bash
        run: |
          set -euo pipefail

          echo "=========================================="
          echo " K8s SECRET dpn-health-tls (kubernetes.io/tls, 3 keys, ns=ns-dpn-health-01)"
          echo "=========================================="
          # 3-key kubernetes.io/tls for the oauth2-proxy observability gateways.
          # MUST use 'generic --type=kubernetes.io/tls' (NOT 'create secret tls') so ca.crt
          # is preserved — without ca.crt the proxy can't verify Keycloak on redeem/JWKS.
          kubectl delete secret dpn-health-tls -n ns-dpn-health-01 --ignore-not-found >/dev/null 2>&1
          if ! kubectl create secret generic dpn-health-tls \
            --type=kubernetes.io/tls \
            --namespace ns-dpn-health-01 \
            --from-file=tls.crt="$OUT_DIR/certs/server.crt" \
            --from-file=tls.key="$OUT_DIR/certs/server.key" \
            --from-file=ca.crt="$OUT_DIR/ca/dpn-root.crt"; then
            echo "::error::Failed to create dpn-health-tls secret in namespace ns-dpn-health-01."
            echo "::group::DEBUG - namespace + existing secrets"
            kubectl get ns ns-dpn-health-01 || true
            kubectl get secrets -n ns-dpn-health-01 || true
            echo "::endgroup::"
            exit 1
          fi
          echo "Secret 'dpn-health-tls' (tls.crt + tls.key + ca.crt) created/updated in ns-dpn-health-01."

      - name: Create K8s Secret — dpn-health-tls (targetNamespace copy for Airflow HTTPS)
        if: ${{ inputs.createHealthTls }}
        shell: bash
        run: |
          set -euo pipefail

          echo "=========================================="
          echo " K8s SECRET dpn-health-tls (kubernetes.io/tls, 3 keys, ns=${{ inputs.targetNamespace }})"
          echo "=========================================="
          # Same cert as the ns-dpn-health-01 copy above — Airflow's webserver
          # runs in targetNamespace and needs its own copy to terminate TLS.
          kubectl delete secret dpn-health-tls -n "${{ inputs.targetNamespace }}" --ignore-not-found >/dev/null 2>&1
          if ! kubectl create secret generic dpn-health-tls \
            --type=kubernetes.io/tls \
            --namespace "${{ inputs.targetNamespace }}" \
            --from-file=tls.crt="$OUT_DIR/certs/server.crt" \
            --from-file=tls.key="$OUT_DIR/certs/server.key" \
            --from-file=ca.crt="$OUT_DIR/ca/dpn-root.crt"; then
            echo "::error::Failed to create dpn-health-tls secret in namespace ${{ inputs.targetNamespace }}."
            echo "::group::DEBUG - namespace + existing secrets"
            kubectl get ns "${{ inputs.targetNamespace }}" || true
            kubectl get secrets -n "${{ inputs.targetNamespace }}" || true
            echo "::endgroup::"
            exit 1
          fi
          echo "Secret 'dpn-health-tls' (tls.crt + tls.key + ca.crt) created/updated in ${{ inputs.targetNamespace }}."

      ###################################################################
      # ARTIFACT MANIFEST + NEXT STEPS
      ###################################################################
      - name: Print artifact manifest + next steps
        shell: bash
        run: |
          echo ""
          echo "=========================================================================="
          echo " ARTIFACT MANIFEST (all cert byproducts are published as a pipeline artifact)"
          echo "=========================================================================="
          # Everything under OUT_DIR is published. Key items for distribution:
          #   ca/dpn-root.crt   -> import into browsers/OS to TRUST the self-signed server cert
          #   dsm-client.p12    -> install in a browser as the mTLS CLIENT cert
          #   certs/server.crt  -> Vault HTTPS server cert (PEM)
          #   keystore.jks      -> Keycloak/Kafka server identity (alias dpn-server)
          #   truststore.jks    -> trust store (dpn-root + dpn-client-ca)
          # NOTE: the artifact also contains PRIVATE KEYS — including the ROOT CA key
          #   ca/dpn-root.key (can sign anything). Treat this artifact as SENSITIVE and
          #   restrict who can download it.
          find "$OUT_DIR" -type f | sed "s|$OUT_DIR/|  |" | sort

          echo ""
          echo "=========================================================================="
          echo " VAULT DSM BOOTSTRAP (separate, manual — unchanged flow):"
          echo "   - artifact contains certs/vault.csr + certs/vault.key (wildcard SAN)"
          echo "   - sign vault.csr at DSM Vault -> certificate.pem + ca-chain.pem"
          echo "   - run vault-load-bundle-cd with vault.key + certificate.pem + ca-chain.pem"
          echo "=========================================================================="
          echo " NEXT (coordinated cutover — deploy/restart one by one):"
          echo "   0. MANUAL: set KEYCLOAK-ADMIN-PASSWORD, KC-DB-PASSWORD, KAFKA-OAUTH-CLIENT-SECRET in the secrets backend"
          echo "   1. Vault:        point tls_cert_file/tls_key_file at VAULT-TLS-CERT/KEY, restart"
          echo "   2. cert-manager: uses cert-manager-truststore (dpn-root), rollout restart"
          echo "   3. Keycloak:     tlsSecretName=dpn-tls, KC_HTTPS_KEY_ALIAS=dpn-server, restart"
          echo "                    (dpn-keycloak-secrets SPC pulls KC-*/admin/db from the secrets backend)"
          echo "   4. Kafka src+target + federator server/client: mount dpn-tls, restart"
          echo "                    (kafka-secrets SPC pulls KC-*/UNIVERSAL/OAuth from the secrets backend)"
          echo "   5. federator gateway HTTPS: uses fed-gateway-tls (tls.crt/tls.key)"
          echo "   6. observability gateways (ns-dpn-health-01): use dpn-health-tls; restart oauth2-proxy releases"
          echo "   7. Airflow webserver (targetNamespace): uses dpn-health-tls; rollout restart dpn-airflow-webserver"
          echo "   Browser mTLS:    import ca/dpn-root.crt (trust) + install dsm-client.p12 (client)"
          echo "=========================================================================="

      - name: Publish AWS Universal TLS artifact (all cert byproducts)
        uses: actions/upload-artifact@v4
        with:
          name: dpn-tls-${{ inputs.cloud }}-${{ inputs.environment }}-${{ inputs.cluster }}
          path: dpn-tls/
