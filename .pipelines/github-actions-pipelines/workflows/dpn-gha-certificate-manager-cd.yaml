name: DPN CD - Certificate Manager

on:
  workflow_dispatch:
    inputs:
      environment:
        description: "Select Environment"
        required: true
        default: "test"
        type: choice
        options:
          - dev
          - test

      cluster:
        description: "Target DPN Cluster"
        required: true
        default: "dpn01"
        type: choice
        options:
          - dpn01
          - dpn02

      cloud:
        description: "Target Cloud Provider"
        required: true
        default: "aws"
        type: choice
        options:
          - azure
          - aws
          - gcp

      imageTag:
        description: "Image tag"
        required: true
        type: string

      imageRepository:
        description: "Image path AFTER <<your specific value>>/ (e.g. 1.0.1/certificate-manager) — leave blank to use the environment's configured repository"
        required: false
        default: ""
        type: string

env:
  PARAMETERS_FILE: .github/config/${{ inputs.cloud }}/${{ inputs.environment }}-${{ inputs.cluster }}.json
  CHART_DIR: dpn-federator-cert-manager/charts/certificate-manager
  RELEASE_NAME: dpn-certificate-manager
  VALUES_FILE: dpn-federator-cert-manager/charts/certificate-manager/values/${{ inputs.cloud }}/${{ inputs.environment }}-${{ inputs.cluster }}.yaml
  HUB_ROLE_ARN: <<your specific value>>

permissions:
  id-token: write
  contents: read

jobs:
  deploy:
    name: Helm Deploy
    runs-on: [self-hosted, vmss]
    environment: ${{ inputs.environment }}-${{ inputs.cluster }}
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Applied Parameters
        shell: bash
        run: |
          echo "environment=${{ inputs.environment }}"
          echo "cluster=${{ inputs.cluster }}"
          echo "cloud=${{ inputs.cloud }}"
          echo "imageTag=${{ inputs.imageTag }}"
          echo "imageRepository=${{ inputs.imageRepository }}"

      - name: Read Deployment Config
        shell: bash
        run: |
          set -euo pipefail

          if [ ! -f "${PARAMETERS_FILE}" ]; then
            echo "ERROR: ${PARAMETERS_FILE} not found!"
            exit 1
          fi

          echo "Loading config from ${PARAMETERS_FILE}"
          for key in $(jq -r 'keys_unsorted[]' "${PARAMETERS_FILE}"); do
            value=$(jq -r ".\"$key\"" "${PARAMETERS_FILE}")
            echo "${key}=${value}" >> "$GITHUB_ENV"
            echo "Set ${key}"
          done

      - name: Cloud Login
        uses: ./.github/actions/cloud-login
        with:
          cloud: ${{ inputs.cloud }}
          azure-client-id: ${{ secrets.AZURE_CLIENT_ID }}
          azure-tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          aws-region: ${{ env.AWS_REGION }}
          aws-account-id: ${{ env.AWS_ACCOUNT_ID }}
          eks-cluster: ${{ env.EKS_CLUSTER }}

      - name: Verify Cluster Access
        shell: bash
        run: |
          set -euo pipefail
          kubectl get ns >/dev/null
          echo "Cluster context ready"

      ###################################################################
      # Fetch the AppRole role_id created by
      # "DPN CD - Certificate Manager Role ID Creation" (run that workflow
      # first) so the checked-in values file's roleId never needs manual
      # editing and can't go stale relative to Vault.
      ###################################################################
      - name: Fetch Vault AppRole Role ID (AWS)
        if: ${{ inputs.cloud == 'aws' }}
        shell: bash
        run: |
          set -euo pipefail

          VAULT_APPROLE_ROLE_ID=$(aws secretsmanager get-secret-value \
            --secret-id "dpn/${{ inputs.environment }}-${{ inputs.cluster }}/certificate-manager/VAULT_APPROLE_ROLE_ID" \
            --query SecretString --output text)

          echo "VAULT_APPROLE_ROLE_ID=$VAULT_APPROLE_ROLE_ID" >> "$GITHUB_ENV"

      ###################################################################
      # HELM LINT + DRY RUN
      ###################################################################
      - name: Helm Lint + Dry Run
        shell: bash
        run: |
          set -euo pipefail

          EXTRA_ARGS=()
          if [ -n "${{ inputs.imageRepository }}" ]; then
            EXTRA_ARGS+=(--set image.repository="<<your specific value>>/${{ inputs.imageRepository }}")
          fi
          if [ -n "${VAULT_APPROLE_ROLE_ID:-}" ]; then
            EXTRA_ARGS+=(--set vault.appRole.roleId="$VAULT_APPROLE_ROLE_ID")
          fi

          helm lint "$CHART_DIR" -f "$VALUES_FILE" \
            --set image.tag="${{ inputs.imageTag }}" \
            "${EXTRA_ARGS[@]}"

          helm upgrade --install "$RELEASE_NAME" "$CHART_DIR" \
            --namespace "$NAMESPACE" \
            -f "$VALUES_FILE" \
            --set image.tag="${{ inputs.imageTag }}" \
            "${EXTRA_ARGS[@]}" \
            --dry-run

          echo "Validation passed"

      ###################################################################
      # HELM DEPLOY
      ###################################################################
      - name: Helm Deploy
        shell: bash
        run: |
          set -euo pipefail

          # NOTE: no --wait/--timeout here. Long-lived watches against the EKS
          # API from this runner are unreliable and time out ("context deadline
          # exceeded") even when the rollout completes successfully on the
          # cluster (confirmed via `kubectl rollout status` from a session with
          # a stable connection, which returns instantly). Short-lived calls
          # are fine, so: fire the upgrade without waiting, then poll readiness
          # with a short per-attempt timeout and a few retries instead.
          EXTRA_ARGS=()
          if [ -n "${{ inputs.imageRepository }}" ]; then
            EXTRA_ARGS+=(--set image.repository="<<your specific value>>/${{ inputs.imageRepository }}")
          fi
          if [ -n "${VAULT_APPROLE_ROLE_ID:-}" ]; then
            EXTRA_ARGS+=(--set vault.appRole.roleId="$VAULT_APPROLE_ROLE_ID")
          fi

          if ! helm upgrade --install "$RELEASE_NAME" "$CHART_DIR" \
            --namespace "$NAMESPACE" \
            -f "$VALUES_FILE" \
            --set image.tag="${{ inputs.imageTag }}" \
            "${EXTRA_ARGS[@]}"; then
            echo "::error::Helm Deploy (helm upgrade --install) failed."

            echo "::group::DEBUG - helm status"
            helm status "$RELEASE_NAME" -n "$NAMESPACE" || true
            echo "::endgroup::"

            exit 1
          fi

          echo "Helm upgrade call succeeded — polling rollout status separately..."

          ROLLOUT_OK=false
          for attempt in 1 2 3 4 5; do
            if kubectl rollout status deployment/dpn-certificate-manager -n "$NAMESPACE" --timeout=60s; then
              ROLLOUT_OK=true
              break
            fi
            echo "Rollout status attempt $attempt/5 did not complete within 60s — retrying..."
            sleep 10
          done

          if [ "$ROLLOUT_OK" != "true" ]; then
            echo "::error::Deployment dpn-certificate-manager did not report ready after 5 attempts."

            echo "::group::DEBUG - helm status"
            helm status "$RELEASE_NAME" -n "$NAMESPACE" || true
            echo "::endgroup::"

            echo "::group::DEBUG - pod describe (events, scheduling, mounts)"
            kubectl describe pods -n "$NAMESPACE" -l app=dpn-certificate-manager || true
            echo "::endgroup::"

            echo "::group::DEBUG - PVCs"
            kubectl get pvc -n "$NAMESPACE" || true
            kubectl describe pvc -n "$NAMESPACE" || true
            echo "::endgroup::"

            echo "::group::DEBUG - SecretProviderClass"
            kubectl get secretproviderclass -n "$NAMESPACE" || true
            kubectl describe secretproviderclass -n "$NAMESPACE" dpn-certificate-manager-kv-secrets || true
            echo "::endgroup::"

            echo "::group::DEBUG - namespace events (most recent 50)"
            kubectl get events -n "$NAMESPACE" --sort-by='.lastTimestamp' | tail -n 50 || true
            echo "::endgroup::"

            exit 1
          fi

          echo "========================================"
          echo "POST-DEPLOY STATUS"
          echo "========================================"
          kubectl get pods -n "$NAMESPACE" -l app=dpn-certificate-manager -o wide
          kubectl get pvc -n "$NAMESPACE"

          echo "========================================"
          echo "ROLLING RESTART"
          echo "========================================"
          kubectl rollout restart deployment/dpn-certificate-manager -n "$NAMESPACE"

          ROLLOUT_OK=false
          for attempt in 1 2 3 4 5; do
            if kubectl rollout status deployment/dpn-certificate-manager -n "$NAMESPACE" --timeout=60s; then
              ROLLOUT_OK=true
              break
            fi
            echo "Rolling-restart rollout status attempt $attempt/5 did not complete within 60s — retrying..."
            sleep 10
          done

          if [ "$ROLLOUT_OK" != "true" ]; then
            echo "::error::Rolling restart did not complete after 5 attempts."
            echo "::group::DEBUG - pod describe after failed rollout"
            kubectl describe pods -n "$NAMESPACE" -l app=dpn-certificate-manager || true
            echo "::endgroup::"
            exit 1
          fi

      ###################################################################
      # CAPTURE DEPLOYED IMAGE DIGEST
      ###################################################################
      - name: Capture Deployed Image Digest
        shell: bash
        run: |
          set -euo pipefail

          CM_DIGEST=$(kubectl get pods -n "$NAMESPACE" \
            -l app=dpn-certificate-manager \
            -o jsonpath='{.items[0].status.containerStatuses[0].imageID}')

          if [ -z "$CM_DIGEST" ]; then
            echo "::error::Could not resolve deployed certificate-manager image digest from pod status"
            exit 1
          fi

          echo "Certificate Manager image digest: $CM_DIGEST"

          mkdir -p "$GITHUB_WORKSPACE/deployed-digest"

          {
            echo "$CM_DIGEST"
            echo "component=certificate-manager"
            echo "environment=${{ inputs.environment }}"
            echo "dpncluster=${{ inputs.cluster }}"
            echo "imageTag=${{ inputs.imageTag }}"
          } > "$GITHUB_WORKSPACE/deployed-digest/certificate-manager-digest.txt"

          echo "Digest written to $GITHUB_WORKSPACE/deployed-digest"

      - name: Publish Deployed Image Digest
        uses: actions/upload-artifact@v4
        with:
          name: deployed-image-digest
          path: deployed-digest/
