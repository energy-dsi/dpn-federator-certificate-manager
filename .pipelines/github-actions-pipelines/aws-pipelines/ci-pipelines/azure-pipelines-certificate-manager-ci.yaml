name: DPN Federator Certificate Manager CI

on:
  workflow_dispatch:
    inputs:
      environment:
        type: choice
        options: [dev, devtest, test]
        required: true

      cluster:
        type: choice
        options: [dpn01, dpn02]
        required: true

      enablePIT:
        description: Enable PIT Mutation Tests
        type: boolean
        default: false

permissions:
  id-token: write
  contents: read

env:
  ENVIRONMENT: ${{ inputs.environment }}
  CLUSTER: ${{ inputs.cluster }}

  CERT_MANAGER_IMAGE: dpn-federator-certificate-manager
  IMAGE_TAG: ${{ github.run_number }}

  DOCKERFILE_PATH: docker/Dockerfile
  PARAMETERS_FILE: .pipelines/github-actions-pipelines/aws-pipelines/config/${{ inputs.environment }}-${{ inputs.cluster }}.json 

  COSIGN_URL: https://github.com/sigstore/cosign/releases/latest/download/cosign-linux-amd64

jobs:

# =====================================================
# STAGE 1 — UNIT TESTS
# =====================================================
  UnitTests:
    name: Unit Tests
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Load Environment Config
        shell: bash
        run: |
          set -e
          jq -r 'keys[]' "$PARAMETERS_FILE" | while read k; do
            echo "$k=$(jq -r ".\"$k\"" "$PARAMETERS_FILE")" >> $GITHUB_ENV
          done

      - name: Set Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"

      - name: Configure Maven settings
        run: |
          mkdir -p ~/.m2
          cat <<EOF > ~/.m2/settings.xml
          <settings>
            <servers>
              <server>
                <id>github</id>
                <username>${GITHUB_MAVEN_USERNAME}</username>
                <password>${GITHUB_MAVEN_TOKEN}</password>
              </server>
            </servers>
          </settings>
          EOF

      - name: DockerHub Login (base images)
        run: |
          echo "$DOCKERHUB_PASSWORD" | docker login \
            -u "$DOCKERHUB_USERNAME" --password-stdin

      - name: Maven Build & Tests
        run: mvn clean verify

      - name: PIT Mutation Tests
        if: ${{ inputs.enablePIT }}
        run: mvn org.pitest:pitest-maven:mutationCoverage

# =====================================================
# STAGE 2 — BUILD & PUSH IMAGE
# =====================================================
  BuildImage:
    name: Build & Push Image
    runs-on: ubuntu-latest
    needs: UnitTests

    steps:
      - uses: actions/checkout@v4

      - name: Load Environment Config
        shell: bash
        run: |
          jq -r 'keys[]' "$PARAMETERS_FILE" | while read k; do
            echo "$k=$(jq -r ".\"$k\"" "$PARAMETERS_FILE")" >> $GITHUB_ENV
          done

      - name: Extract Project Version
        run: |
          VERSION=$(mvn help:evaluate -Dexpression=project.version -q -DforceStdout)
          echo "PROJECT_VERSION=$VERSION" >> $GITHUB_ENV

      - name: Registry Login
        run: |
          echo "$REGISTRY_PASSWORD" | docker login "$REGISTRY_URL" \
            --username "$REGISTRY_USERNAME" --password-stdin

      - name: Build Image
        run: |
          docker build \
            --build-arg BASE_REGISTRY=$BASE_REGISTRY \
            --build-arg JAR_NAME=federator-certificate-manager-$PROJECT_VERSION \
            -f $DOCKERFILE_PATH \
            -t $REGISTRY_URL/$CERT_MANAGER_IMAGE:$IMAGE_TAG .

      - name: Push Image
        run: docker push $REGISTRY_URL/$CERT_MANAGER_IMAGE:$IMAGE_TAG

# =====================================================
# STAGE 3 — COSIGN SIGNING
# =====================================================
  SignImage:
    name: Sign Image
    runs-on: ubuntu-latest
    needs: BuildImage

    steps:
      - name: Install Cosign
        run: |
          curl -sSL "$COSIGN_URL" \
          -o cosign
          chmod +x cosign
          sudo mv cosign /usr/local/bin/

      - name: Sign Image
        env:
          COSIGN_PASSWORD: ${{ secrets.COSIGN_PASSWORD }}
        run: cosign sign $REGISTRY_URL/$CERT_MANAGER_IMAGE:$IMAGE_TAG

# =====================================================
# CLEANUP
# =====================================================
  Cleanup:
    name: Cleanup
    runs-on: ubuntu-latest
    needs: SignImage
    if: always()
    steps:
      - run: docker rmi $REGISTRY_URL/$CERT_MANAGER_IMAGE:$IMAGE_TAG || true