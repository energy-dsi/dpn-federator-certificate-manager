name: DPN Certificate Manager CD

on:
  workflow_dispatch:
    inputs:
      environment:
        description: Target environment
        type: choice
        options: [dev, devtest]
        required: true

      dpnCluster:
        description: Target DPN cluster
        type: choice
        options: [dpn01, dpn02]
        required: true

      imageTag:
        description: Image tag (from CI pipeline)
        required: true

      vaultInitEnabled:
        description: Run Vault Init Job (first deploy only)
        type: boolean
        default: false

      awsRegion:
        description: AWS region
        required: true

      kubectlVersion:
        description: kubectl version
        required: true
        default: "1.29.0"

      helmVersion:
        description: Helm version
        required: true
        default: "v3.14.4"

permissions:
  id-token: write
  contents: read

env:
  ENVIRONMENT: ${{ inputs.environment }}
  DPN_CLUSTER: ${{ inputs.dpnCluster }}
  AWS_REGION: ${{ inputs.awsRegion }}

  CHART_DIR: charts/certificate-manager
  RELEASE_NAME: dpn-certificate-manager

  VALUES_FILE: charts/certificate-manager/values-${{ inputs.environment }}-${{ inputs.dpnCluster }}.yaml
  PARAMETERS_FILE: .pipelines/github-actions-pipelines/aws-pipelines/config/${{ inputs.environment }}-${{ inputs.dpnCluster }}.json

jobs:
# =================================================================================
# STAGE 1 — VALIDATE (HELM LINT + DRY RUN)
# =================================================================================
  Validate:
    runs-on: ubuntu-latest
    name: Validate [${{ inputs.environment }}-${{ inputs.dpnCluster }}]

    steps:
      - uses: actions/checkout@v4

      - name: Load Environment Config
        shell: bash
        run: |
          set -euo pipefail
          if [[ ! -f "$PARAMETERS_FILE" ]]; then
            echo "ERROR: Missing config $PARAMETERS_FILE"
            exit 1
          fi

          jq -r 'keys[]' "$PARAMETERS_FILE" | while read key; do
            echo "$key=$(jq -r ".\"$key\"" "$PARAMETERS_FILE")" >> $GITHUB_ENV
          done

      - name: Check Values File Exists
        shell: bash
        run: |
          if [[ ! -f "$VALUES_FILE" ]]; then
            echo "ERROR: Values file not found: $VALUES_FILE"
            exit 1
          fi

      - name: Configure AWS Credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_ROLE_TO_ASSUME }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Install kubectl & Helm
        shell: bash
        run: |
          curl -LO "https://dl.k8s.io/release/v${{ inputs.kubectlVersion }}/bin/linux/amd64/kubectl"
          chmod +x kubectl && sudo mv kubectl /usr/local/bin/

          curl -fsSL -o get_helm.sh https://raw.githubusercontent.com/helm/helm/main/scripts/get-helm-3
          chmod +x get_helm.sh
          ./get_helm.sh --version ${{ inputs.helmVersion }}

      - name: Configure EKS Context
        shell: bash
        run: |
          aws eks update-kubeconfig \
            --name "$EKS_CLUSTER_NAME" \
            --region "$AWS_REGION"

      - name: Helm Lint & Dry Run
        shell: bash
        run: |
          helm lint "$CHART_DIR" -f "$VALUES_FILE" \
            --set image.tag="${{ inputs.imageTag }}"

          helm upgrade --install "$RELEASE_NAME" "$CHART_DIR" \
            --namespace "$NAMESPACE" \
            -f "$VALUES_FILE" \
            --set image.tag="${{ inputs.imageTag }}" \
            --set vaultInitJob.enabled=${{ inputs.vaultInitEnabled }} \
            --dry-run

# =================================================================================
# STAGE 2 — DEPLOY (APPROVAL GATED)
# =================================================================================
  Deploy:
    needs: Validate
    runs-on: ubuntu-latest
    environment: certificate-manager-${{ inputs.environment }}
    name: Deploy [${{ inputs.environment }}-${{ inputs.dpnCluster }}]

    steps:
      - uses: actions/checkout@v4

      - name: Load Environment Config
        shell: bash
        run: |
          jq -r 'keys[]' "$PARAMETERS_FILE" | while read key; do
            echo "$key=$(jq -r ".\"$key\"" "$PARAMETERS_FILE")" >> $GITHUB_ENV
          done

      - name: Configure AWS Credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_ROLE_TO_ASSUME }}
          aws-region: $AWS_REGION

      - name: Configure EKS Context
        shell: bash
        run: |
          aws eks update-kubeconfig \
            --name "$EKS_CLUSTER_NAME" \
            --region "$AWS_REGION"

      - name: Helm Deploy Certificate Manager
        shell: bash
        run: |
          helm upgrade --install "$RELEASE_NAME" "$CHART_DIR" \
            --namespace "$NAMESPACE" \
            -f "$VALUES_FILE" \
            --set image.tag="${{ inputs.imageTag }}" \
            --set vaultInitJob.enabled=${{ inputs.vaultInitEnabled }} \
            --wait \
            --timeout 5m

          kubectl rollout restart deployment/dpn-certificate-manager -n "$NAMESPACE"
          kubectl rollout status deployment/dpn-certificate-manager -n "$NAMESPACE" --timeout=300s

      - name: Capture Deployed Image Digest
        shell: bash
        run: |
          set -euo pipefail
          CM_DIGEST=$(kubectl get pods -n "$NAMESPACE" \
            -l app=dpn-certificate-manager \
            -o jsonpath='{.items[0].status.containerStatuses[0].imageID}')

          if [[ -z "$CM_DIGEST" ]]; then
            echo "ERROR: Could not resolve deployed certificate-manager image digest from pod status"
            exit 1
          fi

          echo "Certificate Manager image digest: $CM_DIGEST"

          mkdir -p deployed-digest
          {
            echo "$CM_DIGEST"
            echo "component=certificate-manager"
            echo "environment=${{ inputs.environment }}"
            echo "dpnCluster=${{ inputs.dpnCluster }}"
            echo "imageTag=${{ inputs.imageTag }}"
          } > deployed-digest/certificate-manager-digest.txt

      - name: Publish Deployed Image Digest
        uses: actions/upload-artifact@v4
        with:
          name: deployed-image-digest
          path: deployed-digest/certificate-manager-digest.txt

# =================================================================================
# STAGE 3 — VERIFY
# =================================================================================
  Verify:
    needs: Deploy
    runs-on: ubuntu-latest
    name: Verify [${{ inputs.environment }}-${{ inputs.dpnCluster }}]

    steps:
      - name: Verify Deployment
        shell: bash
        run: |
          kubectl rollout status deployment/dpn-certificate-manager \
            -n "$NAMESPACE" --timeout=300s

          kubectl get pods -n "$NAMESPACE" -l app=dpn-certificate-manager -o wide
          kubectl get pvc  -n "$NAMESPACE" -l app.kubernetes.io/name=dpn-certificate-manager

          echo "CERTIFICATE MANAGER DEPLOYMENT VERIFIED"