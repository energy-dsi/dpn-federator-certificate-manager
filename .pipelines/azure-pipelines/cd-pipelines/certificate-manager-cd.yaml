          echo "=========================================="
          echo " ROLLOUT STATUS"
          echo "=========================================="
          kubectl rollout status deployment/dpn-certificate-manager \
            -n $(NAMESPACE) \
            --timeout=300s

          echo "=========================================="
          echo " POD STATUS"
          echo "=========================================="
          kubectl get pods -n $(NAMESPACE) -l app=dpn-certificate-manager -o wide

          echo "=========================================="
          echo " PVC STATUS"
          echo "=========================================="
          kubectl get pvc -n $(NAMESPACE) -l app.kubernetes.io/name=dpn-certificate-manager

