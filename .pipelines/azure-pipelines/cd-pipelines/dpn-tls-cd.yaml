trigger: none

# =============================================================================
# DPN Universal TLS — DPN Platform  (UNIFIED: Vault + Keycloak + Kafka + federator)
#
# ONE self-signed DPN Root CA (dpn-root) and ONE common server cert (CN=dpn-common,
# wildcard SANs) generated by create-dpn-tls.sh, then published in every format /
# secret the platform needs. In ONE run it:
#
#   - generates the universal material (PEM + keystore.jks + truststore.jks + client p12)
#   - Azure Key Vault (with +355-day expiry) — cert-derived password VALUES that the
#     downstream SecretProviderClasses across every DPN repo read (cert-manager,
#     gateway's kafka/keycloak SPCs, auth-svc's keycloak SPC, file-scan-service,
#     health-monitoring's data-prepper) — ONE canonical object per password:
#       VAULT-TLS-CERT      <- certs/server.crt   (Vault HTTPS server cert)
#       VAULT-TLS-KEY       <- certs/server.key   (Vault HTTPS server key)
#       KEYSTORE-PASSWORD   <- keystore.jks password
#       TRUSTSTORE-PASSWORD <- truststore.jks password
#       DPN-CLIENT-P12-PASSWORD <- dpn-client.p12 password
#   - K8s secrets (cert-material files, created directly here):
#       cert-manager-truststore (truststore.jks)             -> cert-manager trusts Vault   [ns-dpn-01]
#       dpn-tls (ca.crt + keystore.jks + truststore.jks)     -> Keycloak + Kafka + federator (incl. gateway HTTPS) [targetNamespace, ns-dpn-health-01]
#       dpn-health-tls (tls.crt + tls.key + ca.crt, kubernetes.io/tls) -> oauth2-proxy observability gateways [ns-dpn-health-01, ns-dpn-01]
#       tls-auth-secret (KEYSTORE_PASSWORD + TRUSTSTORE_PASSWORD + DPN_CLIENT_P12_PASSWORD,
#                        string keys, no file material) -> the ONE place every component
#                        that needs one of these passwords reads it from, instead of each
#                        independently re-syncing the same Key Vault objects via its own
#                        SecretProviderClass. Deliberately a separate secret from dpn-tls:
#                        dpn-tls holds keystore.jks, which contains the actual PRIVATE KEY,
#                        so a component that only ever needs a password (e.g. cert-manager,
#                        which only ever touches the truststore) never needs read access to
#                        the object holding the private key. [targetNamespace, ns-dpn-health-01]
#
# NOT handled here (by design):
#   - dpn-keycloak-secrets K8s secret is created by dpn-authentication-service's
#     SecretProviderClass from the Key Vault values above (and its own KEYCLOAK-ADMIN-
#     PASSWORD / KC-DB-PASSWORD / KC-SERVICE-CLIENT-SECRET, none of which are cert
#     material - the operator sets those in Key Vault MANUALLY).
#   - KC-SERVICE-CLIENT-SECRET (Keycloak's dpn-service-client secret) is the single
#     canonical object used for what used to be a separate KAFKA-OAUTH-CLIENT-SECRET -
#     see dpn-authentication-service's keycloak SecretProviderClass, which owns and
#     republishes it as dpn-keycloak-secrets/KC_SERVICE_CLIENT_SECRET for consumers in
#     ns-dpn-01. dpn-health-monitoring-service's monitoring-master-cd.yaml is
#     responsible for making the same value available in ns-dpn-health-01.
#
# Because Vault, Keycloak, Kafka and cert-manager all derive from ONE dpn-root in a
# single run, the Vault cert and the truststores are consistent BY CONSTRUCTION.
# FIRST cutover is coordinated: restart Vault, cert-manager, Keycloak, both Kafka
# brokers and both federators so they pick up the new material.
#
# Password contract: keystore.jks password == KEYSTORE-PASSWORD (KV);
#                     truststore.jks password == TRUSTSTORE-PASSWORD (KV).
#
# Config resolved from: .pipelines/azure-pipelines/config/<env>-<cluster>.json
#
# Kept SEPARATE from the segregated vault-tls-bootstrap-cd.yaml / keycloak-tls-cd.yaml
# (and their scripts) so those remain a fallback.
# =============================================================================

parameters:

  - name: ServiceConnection
    displayName: 'ServiceConnection details'
    type: string
    default: 'sc-dpn-dev-001'
    values:
      - sc-dpn-dev-001
      - sc-dpn-dev-002
      - sc-dpn-test-001
      - sc-dpn-test-002
      - sc-dpn-pdev-ppd-001
      - sc-dpn-ptest-ppd-001
      - sc-dpn-puat-ppd-001

  - name: environment
    displayName: Environment Name
    type: string
    default: 'dev'
    values:
      - dev
      - devtest
      - test
      - pdev
      - ptest
      - puat

  - name: dpnCluster
    displayName: "Target DPN Cluster (pdev/ptest/puat have only one DPN — dpn02 is disabled for those environments)"
    type: string
    default: "dpn01"
    values:
      - dpn01
      - dpn02

  - name: targetNamespace
    displayName: "Namespace for dpn-tls (where Keycloak/Kafka/federator run)"
    type: string
    default: "ns-dpn-01"
    values:
      - ns-dpn-01

  - name: country
    displayName: "Country (C)"
    type: string
    default: "GB"

  - name: org
    displayName: "Organisation (O)"
    type: string
    default: "DSI"

  - name: keystorePassword
    displayName: "keystore.jks password (Key Vault object: KEYSTORE-PASSWORD)"
    type: string

  - name: truststorePassword
    displayName: "truststore.jks password (Key Vault object: TRUSTSTORE-PASSWORD)"
    type: string

  - name: clientP12Password
    displayName: "dpn-client.p12 password"
    type: string

  - name: extraVaultSans
    displayName: "Extra Vault CSR SANs (comma-separated, e.g. <<your specific value>>,<<your specific value>>). Appended AFTER the fixed wildcard SANs on vault.csr ONLY — not on the universal server.crt. The DSM PKI role signing this CSR must allow these domains."
    type: string
    default: ""

  # NOTE: KEYCLOAK-ADMIN-PASSWORD, KC-DB-PASSWORD and KAFKA-OAUTH-CLIENT-SECRET are
  # NOT handled here (not cert material) — they are set manually in Key Vault by the
  # operator. The kafka-secrets / dpn-keycloak-secrets SecretProviderClasses read them.
  #
  # NOTE: storing cert/store passwords in Key Vault and creating dpn-health-tls in
  # ns-dpn-health-01 are both MANDATORY (no longer optional toggles) — downstream
  # consumers (SecretProviderClasses, oauth2-proxy gateways) always depend on them.

variables:
  - name: PARAMETERS_FILE
    value: ".pipelines/azure-pipelines/config/${{ parameters.environment }}-${{ parameters.dpnCluster }}.json"

  - ${{ if or(eq(parameters.environment, 'pdev'), eq(parameters.environment, 'ptest'), eq(parameters.environment, 'puat')) }}:
    - name: APPROVAL_GROUP
      value: dsi-ppd
  - ${{ elseif or(eq(parameters.environment, 'devtest'), eq(parameters.environment, 'test')) }}:
    - name: APPROVAL_GROUP
      value: dsi-devtest
  - ${{ else }}:
    - name: APPROVAL_GROUP
      value: dsi-dev

stages:

# ============================================================
# Guard — pdev/ptest/puat only have one DPN; dpn02 is disabled
# ============================================================
- stage: GuardSingleDpn
  displayName: "Guard — Single DPN Environments"
  # Runs on EVERY run and FAILS only for the invalid combo. Do NOT gate this
  # stage with a `condition:` — a skipped guard makes the downstream
  # `condition: succeeded()` stages skip too (a skip is NOT a success).
  jobs:
  - job: Block
    pool:
      name: "<<YOUR AGENT POOL>>"
    steps:
    - script: |
        ENV="${{ parameters.environment }}"
        CLUSTER="${{ parameters.dpnCluster }}"
        if printf '%s' "$ENV" | grep -qE '^(pdev|ptest|puat)$' && [ "$CLUSTER" = "dpn02" ]; then
          echo "##[error]dpn02 is disabled for environment '$ENV' — it has only a single DPN."
          exit 1
        fi
        echo "Guard passed: environment '$ENV' with cluster '$CLUSTER' is a valid combination."
      displayName: "Validate DPN cluster for environment"

# ============================================================
# Approval Gate (gated on the environment's approver group)
# ============================================================
- stage: Approval
  displayName: "Approval Gate"

  jobs:
  - deployment: ApprovalJob
    displayName: "Approve DPN universal TLS generation"
    environment: "$(APPROVAL_GROUP)"
    strategy:
      runOnce:
        deploy:
          steps:
          - script: |
              echo "=========================================="
              echo " APPROVAL REQUIRED BEFORE DPN UNIVERSAL TLS GENERATION"
              echo "=========================================="
              echo "Environment : ${{ parameters.environment }}"
              echo "Cluster     : ${{ parameters.dpnCluster }}"
              echo "Namespace   : ${{ parameters.targetNamespace }}"
              echo "=========================================="

# ============================================================
# Generate DPN universal TLS + publish AKV + K8s secrets
# ============================================================
- stage: DpnTls
  displayName: "DPN Universal TLS [${{ parameters.environment }}-${{ parameters.dpnCluster }}]"
  dependsOn:
  - GuardSingleDpn
  - Approval
  condition: succeeded()

  jobs:
  - deployment: DpnTls
    displayName: "Generate universal TLS, publish AKV + dpn-tls (x2)/dpn-health-tls (x2)/cert-manager-truststore"
    environment: "dpn-tls-${{ parameters.environment }}"
    pool:
      name: "<<YOUR AGENT POOL>>"

    strategy:
      runOnce:
        deploy:
          steps:
          - checkout: self

          - script: |
              echo "Loading config from: $(PARAMETERS_FILE)"
              for param in $(jq -r 'keys_unsorted | .[]' "$(Build.SourcesDirectory)/$(PARAMETERS_FILE)"); do
                value=$(jq -r ".\"$param\"" "$(Build.SourcesDirectory)/$(PARAMETERS_FILE)")
                echo "##vso[task.setvariable variable=$param]$value"
              done
            displayName: "Load Environment Config"

          - task: AzureCLI@2
            displayName: "Generate DPN universal TLS + publish AKV + K8s secrets"
            inputs:
              azureSubscription: "${{ parameters.ServiceConnection }}"
              scriptType: bash
              scriptLocation: inlineScript
              inlineScript: |
                set -euo pipefail

                echo "=========================================="
                echo " PASSWORDS (masked)"
                echo "=========================================="
                KEYSTORE_PASS="${{ parameters.keystorePassword }}"
                TRUSTSTORE_PASS="${{ parameters.truststorePassword }}"
                CLIENT_P12_PASS="${{ parameters.clientP12Password }}"
                echo "##vso[task.setvariable variable=KEYSTORE_PASS;issecret=true]$KEYSTORE_PASS"
                echo "##vso[task.setvariable variable=TRUSTSTORE_PASS;issecret=true]$TRUSTSTORE_PASS"
                echo "##vso[task.setvariable variable=CLIENT_P12_PASS;issecret=true]$CLIENT_P12_PASS"

                OUT_DIR="$(Build.ArtifactStagingDirectory)/dpn-tls"

                echo "=========================================="
                echo " GENERATE DPN UNIVERSAL TLS (self-signed, wildcard SANs)"
                echo "=========================================="
                COUNTRY="${{ parameters.country }}" \
                ORG="${{ parameters.org }}" \
                KEYSTORE_PASS="$KEYSTORE_PASS" \
                TRUSTSTORE_PASS="$TRUSTSTORE_PASS" \
                CLIENT_P12_PASS="$CLIENT_P12_PASS" \
                EXTRA_VAULT_SANS="${{ parameters.extraVaultSans }}" \
                OUT_DIR="$OUT_DIR" \
                sh .pipelines/scripts/create-dpn-tls.sh

                EXPIRY="$(date -u -d '+355 days' '+%Y-%m-%d')T00:00:00Z"
                echo "Secret expiry: $EXPIRY"

                echo "=========================================="
                echo " PUBLISH VAULT PEM + PASSWORDS TO KEY VAULT $(KEY_VAULT_NAME)"
                echo "=========================================="
                # Vault HTTPS server material (PEM) — same key+cert as keystore.jks, PEM-encoded
                az keyvault secret set --vault-name $(KEY_VAULT_NAME) --name VAULT-TLS-CERT --file "$OUT_DIR/certs/server.crt" --expires "$EXPIRY" --output none
                az keyvault secret set --vault-name $(KEY_VAULT_NAME) --name VAULT-TLS-KEY  --file "$OUT_DIR/certs/server.key" --expires "$EXPIRY" --output none

                # Universal DPN Platform secret objects — ONE canonical Key Vault object per
                # logical password, read by every SecretProviderClass across every repo that
                # needs it (cert-manager, gateway's kafka-kv-secrets, auth-svc's keycloak SPC,
                # file-scan-service, data-prepper). Replaces the previous 5 separately-named
                # objects (VAULT-TRUSTSTORE-PASSWORD, KC-HTTPS-KEY-STORE-PASSWORD,
                # KC-HTTPS-TRUST-STORE-PASSWORD, KC-SPI-TRUSTSTORE-FILE-PASSWORD,
                # UNIVERSAL-DPN-CERT-PASSWORD), which all held the identical two values.
                # NOT written here (manual): KEYCLOAK-ADMIN-PASSWORD, KC-DB-PASSWORD, KC-SERVICE-CLIENT-SECRET
                az keyvault secret set --vault-name $(KEY_VAULT_NAME) --name KEYSTORE-PASSWORD   --value "$KEYSTORE_PASS"   --expires "$EXPIRY" --output none
                az keyvault secret set --vault-name $(KEY_VAULT_NAME) --name TRUSTSTORE-PASSWORD --value "$TRUSTSTORE_PASS" --expires "$EXPIRY" --output none
                az keyvault secret set --vault-name $(KEY_VAULT_NAME) --name DPN-CLIENT-P12-PASSWORD --value "$CLIENT_P12_PASS" --expires "$EXPIRY" --output none
                echo "Stored VAULT-TLS-*, KEYSTORE-PASSWORD, TRUSTSTORE-PASSWORD and DPN-CLIENT-P12-PASSWORD."
                echo "Reminder: set KEYCLOAK-ADMIN-PASSWORD, KC-DB-PASSWORD, KC-SERVICE-CLIENT-SECRET in Key Vault manually."

                echo "=========================================="
                echo " AKS AUTH"
                echo "=========================================="
                which kubelogin >/dev/null 2>&1 || az aks install-cli --client-version v1.31.0 --kubelogin-version v0.1.4
                az account set --subscription $(AZURE_SUBSCRIPTION_ID)
                az aks get-credentials \
                  --resource-group $(RESOURCE_GROUP) \
                  --name $(AKS_CLUSTER) \
                  --overwrite-existing
                kubelogin convert-kubeconfig -l azurecli

                echo "=========================================="
                echo " K8s SECRET cert-manager-truststore (ns=$(NAMESPACE))"
                echo "=========================================="
                # delete+create (not dry-run|apply) so the base64 truststore is NOT printed to the log
                kubectl delete secret cert-manager-truststore -n $(NAMESPACE) --ignore-not-found >/dev/null 2>&1
                kubectl create secret generic cert-manager-truststore \
                  --namespace $(NAMESPACE) \
                  --from-file=truststore.jks="$OUT_DIR/truststore.jks"
                echo "Secret 'cert-manager-truststore' created/updated in namespace $(NAMESPACE)."

                echo "=========================================="
                echo " K8s SECRET dpn-tls (ca.crt + keystore.jks + truststore.jks, ns=${{ parameters.targetNamespace }})"
                echo "=========================================="
                # GENERIC secret: Keycloak mounts it at /cert; Kafka brokers + federator mount it at /etc/kafka/secrets.
                # ca.crt = the dpn-root CA cert (matches the deployed dpn-tls shape).
                kubectl delete secret dpn-tls -n ${{ parameters.targetNamespace }} --ignore-not-found >/dev/null 2>&1
                kubectl create secret generic dpn-tls \
                  --namespace ${{ parameters.targetNamespace }} \
                  --from-file=ca.crt="$OUT_DIR/ca/dpn-root.crt" \
                  --from-file=keystore.jks="$OUT_DIR/keystore.jks" \
                  --from-file=truststore.jks="$OUT_DIR/truststore.jks"
                echo "Secret 'dpn-tls' (ca.crt + keystore.jks + truststore.jks) created/updated in namespace ${{ parameters.targetNamespace }}."

                echo "=========================================="
                echo " K8s SECRET dpn-tls (ca.crt + keystore.jks + truststore.jks, ns=ns-dpn-health-01)"
                echo "=========================================="
                # Same universal material, also published into ns-dpn-health-01 (the wildcard SANs
                # already cover this namespace) so observability/health workloads there can use it too.
                kubectl delete secret dpn-tls -n ns-dpn-health-01 --ignore-not-found >/dev/null 2>&1
                kubectl create secret generic dpn-tls \
                  --namespace ns-dpn-health-01 \
                  --from-file=ca.crt="$OUT_DIR/ca/dpn-root.crt" \
                  --from-file=keystore.jks="$OUT_DIR/keystore.jks" \
                  --from-file=truststore.jks="$OUT_DIR/truststore.jks"
                echo "Secret 'dpn-tls' (ca.crt + keystore.jks + truststore.jks) created/updated in namespace ns-dpn-health-01."

                echo "=========================================="
                echo " K8s SECRET dpn-health-tls (kubernetes.io/tls, 3 keys, ns=ns-dpn-health-01)"
                echo "=========================================="
                # 3-key kubernetes.io/tls for the oauth2-proxy observability gateways.
                # MUST use 'generic --type=kubernetes.io/tls' (NOT 'create secret tls') so ca.crt
                # is preserved — without ca.crt the proxy can't verify Keycloak on redeem/JWKS.
                kubectl delete secret dpn-health-tls -n ns-dpn-health-01 --ignore-not-found >/dev/null 2>&1
                kubectl create secret generic dpn-health-tls \
                  --type=kubernetes.io/tls \
                  --namespace ns-dpn-health-01 \
                  --from-file=tls.crt="$OUT_DIR/certs/server.crt" \
                  --from-file=tls.key="$OUT_DIR/certs/server.key" \
                  --from-file=ca.crt="$OUT_DIR/ca/dpn-root.crt"
                echo "Secret 'dpn-health-tls' (tls.crt + tls.key + ca.crt) created/updated in ns-dpn-health-01."

                echo "=========================================="
                echo " K8s SECRET dpn-health-tls (kubernetes.io/tls, 3 keys, ns=ns-dpn-01)"
                echo "=========================================="
                # Same universal material, also published into ns-dpn-01 for observability
                # gateways running alongside Keycloak/Kafka/federator there.
                kubectl delete secret dpn-health-tls -n ns-dpn-01 --ignore-not-found >/dev/null 2>&1
                kubectl create secret generic dpn-health-tls \
                  --type=kubernetes.io/tls \
                  --namespace ns-dpn-01 \
                  --from-file=tls.crt="$OUT_DIR/certs/server.crt" \
                  --from-file=tls.key="$OUT_DIR/certs/server.key" \
                  --from-file=ca.crt="$OUT_DIR/ca/dpn-root.crt"
                echo "Secret 'dpn-health-tls' (tls.crt + tls.key + ca.crt) created/updated in ns-dpn-01."

                echo "=========================================="
                echo " K8s SECRET tls-auth-secret (KEYSTORE_PASSWORD + TRUSTSTORE_PASSWORD + DPN_CLIENT_P12_PASSWORD, ns=${{ parameters.targetNamespace }})"
                echo "=========================================="
                # String-only secret, deliberately separate from dpn-tls: dpn-tls holds
                # keystore.jks, which contains the actual private key, so a component that
                # only ever needs a password (e.g. cert-manager, which only ever touches the
                # truststore) never needs read access to the object holding the private key.
                # This is the ONE place every component reads these three passwords from, in
                # place of each independently re-syncing the same Key Vault objects via its
                # own SecretProviderClass (kafka-kv-secrets, dpn-keycloak-kv-secrets and
                # dpn-certificate-manager-kv-secrets previously each did this separately).
                kubectl delete secret tls-auth-secret -n ${{ parameters.targetNamespace }} --ignore-not-found >/dev/null 2>&1
                kubectl create secret generic tls-auth-secret \
                  --namespace ${{ parameters.targetNamespace }} \
                  --from-literal=KEYSTORE_PASSWORD="$KEYSTORE_PASS" \
                  --from-literal=TRUSTSTORE_PASSWORD="$TRUSTSTORE_PASS" \
                  --from-literal=DPN_CLIENT_P12_PASSWORD="$CLIENT_P12_PASS"
                echo "Secret 'tls-auth-secret' created/updated in namespace ${{ parameters.targetNamespace }}."

                echo "=========================================="
                echo " K8s SECRET tls-auth-secret (KEYSTORE_PASSWORD + TRUSTSTORE_PASSWORD + DPN_CLIENT_P12_PASSWORD, ns=ns-dpn-health-01)"
                echo "=========================================="
                # Same universal passwords, also published into ns-dpn-health-01 so
                # health-monitoring's Kafka UI and oauth2-proxy releases there can read them
                # directly too, instead of each independently re-syncing from Key Vault.
                kubectl delete secret tls-auth-secret -n ns-dpn-health-01 --ignore-not-found >/dev/null 2>&1
                kubectl create secret generic tls-auth-secret \
                  --namespace ns-dpn-health-01 \
                  --from-literal=KEYSTORE_PASSWORD="$KEYSTORE_PASS" \
                  --from-literal=TRUSTSTORE_PASSWORD="$TRUSTSTORE_PASS" \
                  --from-literal=DPN_CLIENT_P12_PASSWORD="$CLIENT_P12_PASS"
                echo "Secret 'tls-auth-secret' created/updated in namespace ns-dpn-health-01."

                # NOTE: dpn-keycloak-secrets is NOT created here — it is produced by
                # dpn-authentication-service's SecretProviderClass from Key Vault (this
                # pipeline only publishes the cert-derived password values above, now
                # including tls-auth-secret).

                echo ""
                echo "=========================================================================="
                echo " ARTIFACT MANIFEST (all cert byproducts are published as a pipeline artifact)"
                echo "=========================================================================="
                # Everything under OUT_DIR is published. Key items for distribution:
                #   ca/dpn-root.crt   -> import into browsers/OS to TRUST the self-signed server cert
                #   dpn-client.p12    -> install in a browser as the mTLS CLIENT cert
                #   certs/server.crt  -> Vault HTTPS server cert (PEM)
                #   keystore.jks      -> Keycloak/Kafka server identity (alias dpn-server)
                #   truststore.jks    -> trust store (dpn-root + dpn-client-ca)
                # NOTE: the artifact also contains PRIVATE KEYS — including the ROOT CA key
                #   ca/dpn-root.key (can sign anything). Treat this artifact as SENSITIVE and
                #   restrict who can download it.
                find "$OUT_DIR" -type f | sed "s|$OUT_DIR/|  |" | sort

                echo ""
                echo "=========================================================================="
                echo " VAULT DSM BOOTSTRAP (separate, manual — unchanged flow):"
                echo "   - artifact contains certs/vault.csr + certs/vault.key (wildcard SAN + any extraVaultSans)"
                echo "   - sign vault.csr at DSM Vault -> certificate.pem + ca-chain.pem"
                echo "   - run vault-load-bundle-cd with vault.key + certificate.pem + ca-chain.pem"
                echo "=========================================================================="
                echo " NEXT (coordinated cutover — deploy/restart one by one):"
                echo "   0. MANUAL: set KEYCLOAK-ADMIN-PASSWORD, KC-DB-PASSWORD, KC-SERVICE-CLIENT-SECRET in Key Vault"
                echo "   1. Vault:        point tls_cert_file/tls_key_file at VAULT-TLS-CERT/KEY, restart"
                echo "   2. cert-manager: uses cert-manager-truststore (dpn-root), rollout restart"
                echo "   3. Keycloak:     tlsSecretName=dpn-tls, KC_HTTPS_KEY_ALIAS=dpn-server, restart"
                echo "                    (KEYSTORE_/TRUSTSTORE_PASSWORD from tls-auth-secret; dpn-keycloak-secrets"
                echo "                     SPC still pulls only its own KC-*/admin/db from Key Vault)"
                echo "   4. Kafka src+target + federator server/client: mount dpn-tls, restart"
                echo "                    (KEYSTORE_/TRUSTSTORE_PASSWORD now from tls-auth-secret, not kafka-secrets;"
                echo "                     Kafka OAuth uses dpn-keycloak-secrets/KC_SERVICE_CLIENT_SECRET as before)"
                echo "   5. federator gateway HTTPS: uses dpn-tls's keystore.jks (alias dpn-server)"
                echo "   6. observability gateways (ns-dpn-health-01): use dpn-health-tls; restart oauth2-proxy releases"
                echo "   Browser mTLS:    import ca/dpn-root.crt (trust) + install dpn-client.p12 (client)"
                echo "=========================================================================="

          - task: PublishPipelineArtifact@1
            displayName: "Publish DPN universal TLS artifact (all cert byproducts)"
            inputs:
              targetPath: "$(Build.ArtifactStagingDirectory)/dpn-tls"
              artifact: "dpn-tls-${{ parameters.environment }}-${{ parameters.dpnCluster }}"
