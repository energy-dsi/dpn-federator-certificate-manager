trigger: none

# =============================================================================
# Load Cert Bundle into Vault — DPN Platform   (PART 2 of 2)
#
# Loads the DSM-signed client certificate bundle into the certificate-manager
# KV paths in a running Vault, so certificate-manager can build its initial
# keystore/truststore and self-enrol.
#
# Uses Library > Secure Files (plain names — single global slots, so upload the
# correct environment's bundle before each run):
#   vault.key        — private key generated by our pipeline (user upload)
#   certificate.pem  — signed certificate from DSM
#   ca-chain.pem     — CA chain from DSM
#
# The Vault root token is read at runtime from Key Vault (VAULT-TOKEN, the same
# object vault-https-cd init stores it under); the Vault pod is resolved
# dynamically. The token is never hardcoded.
#
# Config resolved from:
#   .pipelines/azure-pipelines/config/<env>-<cluster>.json
#
# Prerequisites:
#   1. vault-https deployed + UNSEALED in the target cluster.
#   2. Root token in Key Vault as 'VAULT-TOKEN'.
#   3. KV v2 enabled at 'pki-client'.
#   4. vault.key / certificate.pem / ca-chain.pem uploaded to Secure Files.
#
# Writes (read back by certificate-manager via VaultSecretProvider):
#   pki-client/node-net/client/{keypair,certificate,ca-chain}
#
# PART 1 (create Vault TLS material) is the separate
# 'vault-tls-bootstrap-cd.yaml' pipeline.
# =============================================================================

parameters:

  - name: ServiceConnection
    displayName: 'ServiceConnection details'
    type: string
    default: 'sc-dpn-dev-001'
    values:
      - sc-dpn-dev-001
      - sc-dpn-dev-002
      - sc-dpn-test-001
      - sc-dpn-test-002
      - sc-dpn-pdev-ppd-001
      - sc-dpn-ptest-ppd-001
      - sc-dpn-puat-ppd-001

  - name: environment
    displayName: Environment Name
    type: string
    default: 'dev'
    values:
      - dev
      - devtest
      - test
      - pdev
      - ptest
      - puat

  - name: dpnCluster
    displayName: "Target DPN Cluster (pdev/ptest/puat have only one DPN — dpn02 is disabled for those environments)"
    type: string
    default: "dpn01"
    values:
      - dpn01
      - dpn02

variables:
  - name: VAULT_FULL_NAME
    value: "dpn-vault-https"
  - name: VAULT_TOKEN_SECRET_NAME
    value: "VAULT-TOKEN"

  - name: PARAMETERS_FILE
    value: ".pipelines/azure-pipelines/config/${{ parameters.environment }}-${{ parameters.dpnCluster }}.json"

  - ${{ if or(eq(parameters.environment, 'pdev'), eq(parameters.environment, 'ptest'), eq(parameters.environment, 'puat')) }}:
    - name: APPROVAL_GROUP
      value: dsi-ppd
  - ${{ elseif or(eq(parameters.environment, 'devtest'), eq(parameters.environment, 'test')) }}:
    - name: APPROVAL_GROUP
      value: dsi-devtest
  - ${{ else }}:
    - name: APPROVAL_GROUP
      value: dsi-dev

stages:

# ============================================================
# Guard — pdev/ptest/puat only have one DPN; dpn02 is disabled
# ============================================================
- stage: GuardSingleDpn
  displayName: "Guard — Single DPN Environments"
  # This guard runs on EVERY run and FAILS only for the invalid combo. Do NOT
  # re-add a stage-level `condition:` here — a skipped guard makes the downstream
  # `condition: succeeded()` stages skip too (a skip is NOT a success), which
  # silently skips the whole pipeline (the pdev+dpn01 no-op runs).
  jobs:
  - job: Block
    pool:
      name: "<<YOUR AGENT POOL>>"
    steps:
    - script: |
        ENV="${{ parameters.environment }}"
        CLUSTER="${{ parameters.dpnCluster }}"
        if printf '%s' "$ENV" | grep -qE '^(pdev|ptest|puat)$' && [ "$CLUSTER" = "dpn02" ]; then
          echo "##[error]dpn02 is disabled for environment '$ENV' — it has only a single DPN."
          exit 1
        fi
        echo "Guard passed: environment '$ENV' with cluster '$CLUSTER' is a valid combination."
      displayName: "Validate DPN cluster for environment"

# ============================================================
# Approval Gate (gated on the environment's approver group)
# ============================================================
- stage: Approval
  displayName: "Approval Gate"

  jobs:
  - deployment: ApprovalJob
    displayName: "Approve Load Cert Bundle into Vault"
    environment: "$(APPROVAL_GROUP)"
    strategy:
      runOnce:
        deploy:
          steps:
          - script: |
              echo "=========================================="
              echo " APPROVAL REQUIRED BEFORE LOADING CERT BUNDLE"
              echo "=========================================="
              echo "Environment : ${{ parameters.environment }}"
              echo "Cluster     : ${{ parameters.dpnCluster }}"
              echo "=========================================="

# ============================================================
# Load Bootstrap Bundle
# kubectl-cp's vault.key + certificate.pem + ca-chain.pem + load script into
# the Vault pod, then execs it to vault-kv-put the cert-manager KV paths.
# ============================================================
- stage: LoadBootstrapBundle
  displayName: "Load Cert Bundle into Vault [${{ parameters.environment }}-${{ parameters.dpnCluster }}]"
  dependsOn:
  - GuardSingleDpn
  - Approval
  condition: succeeded()

  jobs:
  - deployment: LoadBootstrap
    displayName: "Load cert bundle into Vault"
    environment: "vault-load-bundle-${{ parameters.environment }}"
    pool:
      name: "<<YOUR AGENT POOL>>"

    strategy:
      runOnce:
        deploy:
          steps:
          - checkout: self

          - script: |
              echo "Loading config from: $(PARAMETERS_FILE)"
              for param in $(jq -r 'keys_unsorted | .[]' "$(Build.SourcesDirectory)/$(PARAMETERS_FILE)"); do
                value=$(jq -r ".\"$param\"" "$(Build.SourcesDirectory)/$(PARAMETERS_FILE)")
                echo "##vso[task.setvariable variable=$param]$value"
              done
            displayName: "Load Environment Config"

          - task: DownloadSecureFile@1
            name: bsKey
            displayName: "Download Vault private key (vault.key)"
            inputs:
              secureFile: "vault.key"

          - task: DownloadSecureFile@1
            name: bsCert
            displayName: "Download signed certificate (certificate.pem)"
            inputs:
              secureFile: "certificate.pem"

          - task: DownloadSecureFile@1
            name: bsChain
            displayName: "Download CA chain (ca-chain.pem)"
            inputs:
              secureFile: "ca-chain.pem"

          - task: AzureCLI@2
            displayName: "Load Bundle into Vault"
            inputs:
              azureSubscription: "${{ parameters.ServiceConnection }}"
              scriptType: bash
              scriptLocation: inlineScript
              inlineScript: |
                set -euo pipefail

                echo "=========================================="
                echo " AKS AUTH"
                echo "=========================================="
                which kubelogin >/dev/null 2>&1 || az aks install-cli
                az account set --subscription $(AZURE_SUBSCRIPTION_ID)
                az aks get-credentials \
                  --resource-group $(RESOURCE_GROUP) \
                  --name $(AKS_CLUSTER) \
                  --overwrite-existing
                kubelogin convert-kubeconfig -l azurecli

                echo "=========================================="
                echo " RESOLVE VAULT POD"
                echo "=========================================="
                POD=$(kubectl get pod -n $(NAMESPACE) -l app=$(VAULT_FULL_NAME) \
                  -o jsonpath='{.items[0].metadata.name}')
                if [ -z "$POD" ]; then
                  echo "##[error]No vault pod found (app=$(VAULT_FULL_NAME)) in namespace $(NAMESPACE)."
                  echo "##[error]vault-https must already be deployed before running bootstrap load."
                  exit 1
                fi
                echo "Using vault pod: $POD"

                echo "=========================================="
                echo " FETCH ROOT TOKEN FROM KEY VAULT"
                echo "=========================================="
                VAULT_TOKEN=$(az keyvault secret show \
                  --vault-name $(KEY_VAULT_NAME) \
                  --name $(VAULT_TOKEN_SECRET_NAME) \
                  --query "value" -o tsv 2>/dev/null || true)
                if [ -z "$VAULT_TOKEN" ]; then
                  echo "##[error]$(VAULT_TOKEN_SECRET_NAME) not found in Key Vault $(KEY_VAULT_NAME)."
                  echo "##[error]Run Vault Init (vault-https-cd) first so the root token is stored in AKV."
                  exit 1
                fi
                # Mask the token in all subsequent logs
                echo "##vso[task.setvariable variable=VAULT_TOKEN;issecret=true]$VAULT_TOKEN"
                echo "Root token retrieved from Key Vault."

                echo "=========================================="
                echo " COPY BUNDLE INTO POD"
                echo "=========================================="
                kubectl cp "$(bsKey.secureFilePath)"   $(NAMESPACE)/$POD:/tmp/vault.key
                kubectl cp "$(bsCert.secureFilePath)"  $(NAMESPACE)/$POD:/tmp/certificate.pem
                kubectl cp "$(bsChain.secureFilePath)" $(NAMESPACE)/$POD:/tmp/ca-chain.pem
                kubectl cp .pipelines/scripts/load-bootstrap-bundle.sh \
                  $(NAMESPACE)/$POD:/tmp/load-bootstrap-bundle.sh

                echo "=========================================="
                echo " LOAD INTO VAULT"
                echo "=========================================="
                kubectl exec -n $(NAMESPACE) "$POD" -- sh -c "
                  tr -d '\r' < /tmp/load-bootstrap-bundle.sh > /tmp/lbb.sh &&
                  KEY_FILE='/tmp/vault.key' KV_MOUNT='pki-client' KV_BASE='node-net/client' VAULT_TOKEN='$VAULT_TOKEN' sh /tmp/lbb.sh
                "

                echo "=========================================="
                echo " CLEANUP POD TEMP FILES"
                echo "=========================================="
                kubectl exec -n $(NAMESPACE) "$POD" -- sh -c "
                  rm -f /tmp/vault.key /tmp/certificate.pem /tmp/ca-chain.pem \
                        /tmp/lbb.sh /tmp/load-bootstrap-bundle.sh
                "

                echo "Bootstrap bundle loaded into pki-client/node-net/client/* successfully."
