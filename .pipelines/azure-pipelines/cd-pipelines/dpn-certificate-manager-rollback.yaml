trigger: none

pool:
  name: <<YOUR AGENT POOL>>

parameters:
- name: ServiceConnection
  displayName: 'ServiceConnection details'
  type: string
  default: 'sc-dpn-dev-001'
  values:
    - sc-dpn-dev-001
    - sc-dpn-dev-002
    - sc-dpn-test-001
    - sc-dpn-test-002
    - sc-dpn-pdev-ppd-001
    - sc-dpn-ptest-ppd-001
    - sc-dpn-puat-ppd-001

- name: environment
  displayName: Environment Name
  type: string
  default: 'dev'
  values:
    - dev
    - devtest
    - test
    - pdev
    - ptest
    - puat

- name: dpnCluster
  displayName: "Target DPN Cluster (pdev/ptest/puat have only one DPN — dpn02 is disabled for those environments)"
  type: string
  default: "dpn01"
  values:
    - dpn01
    - dpn02

- name: release_name
  type: string

variables:
  - name: selected_revision
    value: ""

  - name: PARAMETERS_FILE
    value: ".pipelines/azure-pipelines/config/${{ parameters.environment }}-${{ parameters.dpnCluster }}.json"

  - ${{ if or(eq(parameters.environment, 'pdev'), eq(parameters.environment, 'ptest'), eq(parameters.environment, 'puat')) }}:
    - name: APPROVAL_GROUP
      value: dsi-ppd
  - ${{ elseif or(eq(parameters.environment, 'devtest'), eq(parameters.environment, 'test')) }}:
    - name: APPROVAL_GROUP
      value: dsi-devtest
  - ${{ else }}:
    - name: APPROVAL_GROUP
      value: dsi-dev

# -----------------------------------------------------
# Stage 0 — Guard (pdev/ptest/puat only have one DPN; dpn02 is disabled)
# -----------------------------------------------------
stages:
- stage: GuardSingleDpn
  displayName: "Guard — Single DPN Environments"
  # This guard runs on EVERY run and FAILS only for the invalid combo. Do NOT
  # re-add a stage-level `condition:` here — a skipped guard makes the downstream
  # `condition: succeeded()` stages skip too (a skip is NOT a success), which
  # silently skips the whole pipeline (the pdev+dpn01 no-op runs).
  jobs:
  - job: Block
    steps:
    - script: |
        ENV="${{ parameters.environment }}"
        CLUSTER="${{ parameters.dpnCluster }}"
        if printf '%s' "$ENV" | grep -qE '^(pdev|ptest|puat)$' && [ "$CLUSTER" = "dpn02" ]; then
          echo "##[error]dpn02 is disabled for environment '$ENV' — it has only a single DPN."
          exit 1
        fi
        echo "Guard passed: environment '$ENV' with cluster '$CLUSTER' is a valid combination."
      displayName: "Validate DPN cluster for environment"

# -----------------------------------------------------
# Stage 1 — Precheck
# -----------------------------------------------------
- stage: Prepare
  dependsOn: GuardSingleDpn
  condition: succeeded()
  jobs:
  - job: Checklist
    steps:
    - script: |
        echo "Confirm rollback readiness"
        echo "Check platform health"
        for k in $(jq -r 'keys_unsorted | .[]' "$(Build.SourcesDirectory)/$(PARAMETERS_FILE)"); do
          echo "##vso[task.setvariable variable=$k]$(jq -r ".\"$k\"" "$(Build.SourcesDirectory)/$(PARAMETERS_FILE)")"
        done

    - task: AzureCLI@2
      inputs:
        azureSubscription: "${{ parameters.ServiceConnection }}"
        scriptType: bash
        scriptLocation: inlineScript
        inlineScript: |
          set -e

          echo "================================================="
          echo "INSTALL TOOLS"
          echo "================================================="

          if ! command -v kubectl &>/dev/null || ! command -v kubelogin &>/dev/null; then
            az aks install-cli --client-version 1.32.3 --kubelogin-version 0.2.18
          else
            echo "kubectl and kubelogin already installed, skipping"
          fi

          kubectl version --client >/dev/null
          kubelogin --version >/dev/null
          helm version >/dev/null
          echo "Tools installed"

          export KUBECONFIG=$(Build.SourcesDirectory)/kubeconfig
          rm -f $KUBECONFIG

          az aks get-credentials \
            --resource-group $(RESOURCE_GROUP) \
            --name $(AKS_CLUSTER) \
            --overwrite-existing

          kubelogin convert-kubeconfig -l azurecli

# -----------------------------------------------------
# Stage 2 — Discover Revisions
# -----------------------------------------------------
- stage: DiscoverRevisions
  dependsOn: Prepare
  jobs:
  - job: ShowRevisions
    steps:
    - script: |
        CONFIG_FILE="$(Build.SourcesDirectory)/$(PARAMETERS_FILE)"
        for key in $(jq -r 'keys_unsorted | .[]' "$CONFIG_FILE"); do
          echo "##vso[task.setvariable variable=$key]$(jq -r ".\"$key\"" "$CONFIG_FILE")"
        done

    - task: AzureCLI@2
      name: setRevisions
      displayName: "Fetch Last 5 Helm Revisions"
      inputs:
        azureSubscription: "${{ parameters.ServiceConnection }}"
        scriptType: bash
        scriptLocation: inlineScript
        inlineScript: |
          set -e

          export KUBECONFIG=$(Build.SourcesDirectory)/kubeconfig
          rm -f $KUBECONFIG
          echo "================================================="
          echo "INSTALL TOOLS"
          echo "================================================="

          if ! command -v kubectl &>/dev/null || ! command -v kubelogin &>/dev/null; then
            az aks install-cli --client-version 1.32.3 --kubelogin-version 0.2.18
          else
            echo "kubectl and kubelogin already installed, skipping"
          fi

          kubectl version --client >/dev/null
          kubelogin --version >/dev/null
          helm version >/dev/null
          echo "Tools installed"

          az aks get-credentials \
            --resource-group $(RESOURCE_GROUP) \
            --name $(AKS_CLUSTER) \
            --overwrite-existing

          kubelogin convert-kubeconfig -l azurecli

          REV_LIST=$(helm history ${{ parameters.release_name }} -n $(NAMESPACE) -o json | jq -r '
            .[-5:][] |
            "Revision: \(.revision) | Status: \(.status) | Updated: \(.updated)"
          ')

          echo "Last 5 revisions:"
          echo "$REV_LIST"

          REV_LIST_ESCAPED=$(echo "$REV_LIST" | sed ':a;N;$!ba;s/\n/%0A/g')

          echo "##vso[task.setvariable variable=revision_list;isOutput=true]$REV_LIST_ESCAPED"

# -----------------------------------------------------
# Stage 3 — Approval
# -----------------------------------------------------
- stage: Approval
  dependsOn: DiscoverRevisions

  variables:
    revision_list: $[ stageDependencies.DiscoverRevisions.ShowRevisions.outputs['setRevisions.revision_list'] ]

  jobs:
  - job: WaitForSelection
    pool: server
    steps:
    - task: ManualValidation@0
      inputs:
        instructions: |
          Last 5 Helm revisions:

          $(revision_list)

          Set:

            selected_revision = <revision_number>

          If not provided:
          previous stable revision will be used automatically.

          Only deployed or superseded revisions are allowed.

# -----------------------------------------------------
# Stage 4 — Rollback
# -----------------------------------------------------
- stage: Rollback
  dependsOn: Approval
  jobs:
  - deployment: RollbackJob
    environment: "$(APPROVAL_GROUP)"
    strategy:
      runOnce:
        deploy:
          steps:
          - script: |
              CONFIG_FILE="$(Build.SourcesDirectory)/$(PARAMETERS_FILE)"
              for key in $(jq -r 'keys_unsorted | .[]' "$CONFIG_FILE"); do
                echo "##vso[task.setvariable variable=$key]$(jq -r ".\"$key\"" "$CONFIG_FILE")"
              done

          - task: AzureCLI@2
            displayName: "Execute Safe Rollback"
            inputs:
              azureSubscription: "${{ parameters.ServiceConnection }}"
              scriptType: bash
              scriptLocation: inlineScript
              inlineScript: |
                set -e

                echo "================================================="
                echo "INSTALL TOOLS"
                echo "================================================="

                if ! command -v kubectl &>/dev/null || ! command -v kubelogin &>/dev/null; then
                  az aks install-cli --client-version 1.32.3 --kubelogin-version 0.2.18
                else
                  echo "kubectl and kubelogin already installed, skipping"
                fi

                kubectl version --client >/dev/null
                kubelogin --version >/dev/null
                helm version >/dev/null
                echo "Tools installed"
                rm -f $KUBECONFIG
                export KUBECONFIG=$(Build.SourcesDirectory)/kubeconfig
                az aks get-credentials \
                  --resource-group $(RESOURCE_GROUP) \
                  --name $(AKS_CLUSTER) \
                  --overwrite-existing

                kubelogin convert-kubeconfig -l azurecli

                if [ -z "$(selected_revision)" ]; then
                  echo "No revision selected, picking previous stable"

                  REV=$(helm history ${{ parameters.release_name }} -n $(NAMESPACE) -o json | jq -r '
                    map(select(.status=="deployed" or .status=="superseded")) | .[-2].revision
                  ')
                else
                  REV=$(selected_revision)
                fi

                echo "Selected revision: $REV"

                STATUS=$(helm history ${{ parameters.release_name }} -n $(NAMESPACE) -o json | jq -r "
                  .[] | select(.revision == ($REV|tonumber)) | .status
                ")

                echo "Status: $STATUS"

                if [[ "$STATUS" != "deployed" && "$STATUS" != "superseded" ]]; then
                  echo "Rollback blocked: invalid revision"
                  exit 1
                fi

                echo "Dry run"
                helm rollback ${{ parameters.release_name }} $REV -n $(NAMESPACE) --dry-run

                echo "Executing rollback"
                helm rollback ${{ parameters.release_name }} $REV \
                  -n $(NAMESPACE) \
                  --wait \
                  --timeout 10m

               
# -----------------------------------------------------
# Stage 5 — Verify
# -----------------------------------------------------
- stage: Verify
  dependsOn: Rollback
  jobs:
  - job: Verify
    steps:
    - script: |
        CONFIG_FILE="$(Build.SourcesDirectory)/$(PARAMETERS_FILE)"
        for key in $(jq -r 'keys_unsorted | .[]' "$CONFIG_FILE"); do
          echo "##vso[task.setvariable variable=$key]$(jq -r ".\"$key\"" "$CONFIG_FILE")"
        done

    - task: AzureCLI@2
      inputs:
        azureSubscription: "${{ parameters.ServiceConnection }}"
        scriptType: bash
        scriptLocation: inlineScript
        inlineScript: |
          set -e

          export KUBECONFIG=$(Build.SourcesDirectory)/kubeconfig
          rm -f $KUBECONFIG

          az aks get-credentials \
            --resource-group $(RESOURCE_GROUP) \
            --name $(AKS_CLUSTER)

          kubelogin convert-kubeconfig -l azurecli

          echo "Helm status"
          helm status ${{ parameters.release_name }} -n $(NAMESPACE)

          echo "Recent revisions"
          helm history ${{ parameters.release_name }} -n $(NAMESPACE) | tail -n 3

          echo "Pods"
          kubectl get pods -n $(NAMESPACE)
          echo "Verifying rollback content"
